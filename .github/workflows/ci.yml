name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov==7.0.0

      - name: Lint
        shell: python
        run: |
          import subprocess
          import sys

          files = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True
          ).splitlines()
          if not files:
              print("No Python files found for flake8", file=sys.stderr)
              raise SystemExit(1)

          cmd = ["flake8", *files]
          print("Running:", " ".join(cmd))
          raise SystemExit(subprocess.call(cmd))

      - name: Unit/UI tests + coverage gate
        shell: bash
        run: |
          mkdir -p reports
          pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov=agent \
            --cov=desktop \
            --cov=session.py \
            --cov=state.py \
            --cov=config.py \
            --cov=utils.py \
            --cov=bot.py \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=55

      - name: Build source artifact
        shell: bash
        run: |
          mkdir -p dist
          python -m utils.source_artifact build --root . > reports/source_artifact.json

      - name: Smoke tests
        shell: bash
        env:
          SMOKE_SOURCE_ARTIFACT: dist/source-*.zip
        run: |
          pytest -q tests/smoke

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports
          if-no-files-found: warn

      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
