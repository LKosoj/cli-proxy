repos:
  - repo: local
    hooks:
      - id: check-i18n-parity
        name: i18n parity check
        entry: python3 scripts/check_i18n_parity.py
        language: python
        pass_filenames: false
        args: [--analyst-dir, modes/analyst/templates, --manager-dir, modes/manager/i18n,
               --languages, ru, en, zh, de, --lint-purity]
