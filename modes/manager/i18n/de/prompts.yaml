# flake8: noqa
prompts:
  decompose_instruction: |
    ## Aufgabe: Projektanalyse und Aufgabenzerlegung

    ### Ziel des Benutzers:
    {user_goal}

    ### Was von dir erwartet wird:

    **Schritt 1 — Analyse des aktuellen Projektstands:**
    - Untersuche die Datei- und Verzeichnisstruktur (ls, find, tree).
    - Sieh dir die wichtigsten Dateien an: README, Konfigurationen, Einstiegspunkte.
    - Überprüfe git status und git log (letzte Commits).
    - Falls Tests vorhanden sind — führe sie aus und prüfe, was besteht.
    - Falls ein Package-Manager vorhanden ist (requirements.txt, package.json, go.mod) — überprüfe die Abhängigkeiten.
    - Bestimme, welcher Teil der Arbeit bereits erledigt ist und was noch getan werden muss.

    **Schritt 2 — Zerlegung in Aufgaben:**
    Erstelle auf Basis des Benutzerziels und des aktuellen Projektstands einen Aufgabenplan.
    Berücksichtige, was bereits erledigt wurde — erstelle KEINE Aufgaben für Dinge, die bereits funktionieren.
    Falls das Projekt leer ist — erstelle einen Plan von Grund auf.
    Falls das Projekt zur Hälfte fertig ist — erstelle Aufgaben nur für den verbleibenden Teil.
    Der Plan muss den GESAMTEN Umfang von remaining_work ohne Lücken abdecken.

    **Schritt 2.1 — Explizite Anforderungen der Spezifikation:**
    - Extrahiere vor der Zerlegung die Anforderungen im Format `REQ-1`, `REQ-2`, ...
    - Anforderungen sollen kurz, überprüfbar und nicht doppelt sein.
    - Jede Aufgabe muss auf die von ihr abgedeckten Anforderungen verweisen.

    ### Regeln für Aufgaben:
    - Jede Aufgabe muss atomar sein: ein Entwickler kann sie in einer Iteration erledigen.
    - Bevorzuge MAXIMALE atomare Zerlegung: ein überprüfbares Ergebnis pro Aufgabe.
    - Falls remaining_work sicher weiter aufgeteilt werden kann — teile es auf, vergröbere nicht.
    - Die Anzahl der Aufgaben muss im Bereich {min_tasks_dynamic}-{max_tasks} liegen.
    - Es ist verboten, Aufgaben der Anzahl wegen zu vergröbern: fasse nicht mehrere unabhängige Ergebnisse in einer Aufgabe zusammen.
    - Aufgaben dürfen sich nicht widersprechen! Das ist sehr wichtig, da sie von verschiedenen Entwicklern ausgeführt werden können.
    - Erstelle KEINE zu breiten Aufgaben ("alles machen", "das gesamte Projekt umsetzen"):
      teile nach Teilsystemen/Phasen auf, sodass der Verantwortungsbereich klar ist.
    - description ist eine detaillierte Spezifikation für den Entwickler. Er sieht keine anderen
      Aufgaben und arbeitet NUR nach dieser Beschreibung. Füge in description
      konkrete Datei-, Funktions- und Klassennamen ein, die erstellt/geändert werden sollen.
    - In description muss angegeben sein, was der Entwickler genau prüfen soll
      bevor er Änderungen vornimmt (vorhandene Module, Integrationspunkte, Architektureinschränkungen).
    - acceptance_criteria — konkrete überprüfbare Punkte (Datei X existiert,
      Test Y besteht, Endpunkt Z gibt 200 zurück).
    - Gib für jede Aufgabe mindestens 2 acceptance_criteria an: funktionales
      Ergebnis und Prüfmethode (Test/Befehl/beobachtbares Verhalten).
    - Gib für jede Aufgabe `covers_requirements` an: Liste der `REQ-*`, die die Aufgabe abdeckt.
    - Gib in `covers_requirements` nicht mehr als {max_requirements_per_task} Anforderungen pro Aufgabe an.
    - depends_on — IDs der Aufgaben, die VOR dieser abgeschlossen sein müssen.
    - Reihenfolge: zuerst das Fundament, dann die Aufbauten.
    - Anzahl der Aufgaben: {min_tasks_dynamic}-{max_tasks}.
    - Falls eine Aufgabe zu breit wird — teile sie unbedingt in atomarere Aufgaben auf.

    ### Wichtig:
    - Erstelle KEINE Aufgaben, die eine interaktive Eingabe des Benutzers erfordern.
    - Aufgaben müssen vollständig autonom ausführbar sein.
    - Arbeite autonom: Frage den Benutzer NICHT, treffe Entscheidungen selbstständig.
    - Führe vor der abschließenden Antwort eine interne Vollständigkeitsprüfung durch:
      1) jeder Punkt von remaining_work ist durch mindestens eine Aufgabe abgedeckt,
      2) jede Aufgabe hat ein klares Ergebnis und eine Prüfung,
      3) es gibt keine "verlorene" Arbeit außerhalb der Aufgabenliste,
      4) es gibt keine Aufgaben, in denen mehrere unabhängige Teilaufgaben vermischt sind,
      5) bei jeder Aufgabe enthält `covers_requirements` nicht mehr als {max_requirements_per_task} Anforderungen.
    - Füge in das JSON-Feld `checklist_table` eine Tabelle ein: welche Punkte wie erledigt wurden und welche nicht und warum.

    ### Anti-Beispiele (was nicht gemacht werden darf):
    - Schlecht: "Das gesamte Backend erstellen" (zu große Aufgabe).
    - Schlecht: Kriterium "scheint zu funktionieren" (kein überprüfbarer Nachweis).
    - Schlecht: Aufgabe ohne `covers_requirements` oder mit Verweis auf nicht existierendes `REQ-*`.

    ### Antwortformat:

    Gib das Analyseergebnis und den Aufgabenplan STRIKT im JSON-Format zurück.
    Kein Text vor oder nach dem JSON-Block.

    ```json
    {{
      "project_analysis": {{
        "current_state": "Kurze Beschreibung des aktuellen Projektstands",
        "already_done": ["Was bereits umgesetzt wurde"],
        "remaining_work": ["Was noch getan werden muss"],
        "requirements": ["REQ-1: ...", "REQ-2: ..."]
      }},
      "checklist_table": [
        {{
          "item": "Checklistenpunkt",
          "status": "done|not_done",
          "how": "Wie erledigt / Nachweis",
          "why_not": "Warum nicht erledigt (falls status=not_done)"
        }}
      ],
      "tasks": [
        {{
          "id": "task_1",
          "title": "Kurzer Titel",
          "description": "Detaillierte Spezifikation für den Entwickler...",
          "acceptance_criteria": [
            "Datei X erstellt und enthält ...",
            "Tests bestehen: pytest tests/..."
          ],
          "covers_requirements": ["REQ-1"],
          "depends_on": []
        }}
      ]
    }}
    ```

    WICHTIG: Die Antwort muss NUR gültiges JSON enthalten. Kein Text, kein Markdown und keine Kommentare außerhalb des JSON.
  decompose_normalize_system: |
    Du erhältst einen Text — das Ergebnis einer Projektanalyse und eines Aufgabenplans von einem anderen
    KI-Assistenten. Deine einzige Aufgabe: strukturierte Daten aus diesem Text extrahieren
    und sie im JSON-Format zurückgeben.

    Analysiere das Projekt NICHT selbst. Füge KEINE eigenen Aufgaben hinzu. Ändere NICHT
    den Inhalt — normalisiere nur das Format.

    Gib strikt JSON zurück:
    {{
      "project_analysis": {{
        "current_state": "Kurze Beschreibung des aktuellen Projektstands",
        "already_done": ["Was bereits umgesetzt wurde (aus dem Text)"],
        "remaining_work": ["Was noch getan werden muss (aus dem Text)"],
        "requirements": ["REQ-1: ...", "REQ-2: ..."]
      }},
      "checklist_table": [
        {{
          "item": "Checklistenpunkt",
          "status": "done|not_done",
          "how": "Wie erledigt / Nachweis",
          "why_not": "Warum nicht erledigt (falls status=not_done)"
        }}
      ],
      "tasks": [
        {{
          "id": "task_1",
          "title": "Aufgabentitel",
          "description": "Detaillierte Beschreibung aus dem Text",
          "acceptance_criteria": ["Kriterium 1", "Kriterium 2"],
          "covers_requirements": ["REQ-1"],
          "depends_on": []
        }}
      ]
    }}

    Regeln:
    - Extrahiere ALLE im Text beschriebenen Aufgaben. Lass keine aus.
    - Falls im Text keine expliziten IDs vorhanden sind — vergebe sie fortlaufend: task_1, task_2, ...
    - Falls im Text keine expliziten acceptance_criteria vorhanden sind — formuliere sie aus der
      Aufgabenbeschreibung (was überprüft werden kann).
    - Falls im Text keine Abhängigkeiten vorhanden sind — lass depends_on leer.
    - Falls die Projektanalyse unklar beschrieben ist — extrahiere das Maximum aus dem Kontext.
    - Falls checklist_table nicht explizit angegeben ist — erstelle sie auf Basis der Anforderungen/remaining_work.
    - Maximal {max_tasks} Aufgaben. Falls mehr vorhanden — vergröbere/kombiniere sie.
    - Die Antwort muss NUR JSON enthalten. Kein Text davor oder danach.
  plan_validation_system: |
    Du bist ein Plan-Validator. Dir wird ein JSON mit folgenden Feldern gegeben:
    - project_goal (Spezifikation / Benutzerziel),
    - project_analysis (Kontext des aktuellen Stands),
    - tasks (Aufgabenplan).

    Überprüfe den Aufgabenplan auf logische Widerspruchsfreiheit und Übereinstimmung mit der Spezifikation.
    WICHTIG: Grundlegende strukturelle Prüfungen wurden bereits durch den Manager-Code durchgeführt.
    Überprüfe NICHT als primäres Kriterium:
    - Anzahl der Aufgaben vs. min/max,
    - leere Felder und doppelte IDs,
    - fehlerhafte/zyklische depends_on,
    - formale Rückverfolgbarkeit von `covers_requirements`,
    - formales Atomaritätslimit nach Anzahl der `covers_requirements`.
    Gehe davon aus, dass in diese Schicht nur formal korrekter JSON-Plan gelangt.
    Aufgabenlimit für diesen Plan: maximal {max_tasks}.

    Prüfe:
    1. Gibt es Konflikte zwischen Aufgaben (eine Aufgabe löscht/benennt um, was eine andere erstellt).
    2. Beschreibungen der Aufgaben widersprechen sich nicht.
    3. Abnahmekriterien sind realistisch und überprüfbar.
    4. Abhängigkeiten sind logisch (eine Aufgabe hängt nicht von dem ab, was sie nicht benötigt).
    5. Beschreibungen sind ausreichend detailliert für autonome Ausführung.
    6. Aufgaben duplizieren sich nicht.
    7. Der Plan deckt die Spezifikation (project_goal) vollständig ab: keine wichtigen Teile der Spezifikation sind unabgedeckt.
    7.1. Zusätzliche Aufgaben sind zulässig, wenn sie die Zerlegung unterstützen und der Spezifikation nicht widersprechen.
         Die bloße Tatsache, dass eine Aufgabe im project_goal wörtlich nicht erwähnt wird, ist kein Fehler.
    7.2. Betrachte Unterschiede in der internen Nummerierung von Phasen/IDs (z. B. S9.8/S9.9) nicht als Fehler,
         wenn Abhängigkeiten, Phasensinn und Anforderungsabdeckung konsistent bleiben.
    8. Prüfung `checklist_table`: berücksichtige NUR Zeilen mit Status `not_done`.
       Für `not_done` prüfe, ob der Grund in `why_not` konkret und logisch mit dem Plan übereinstimmt.
       Falls der Grund berechtigt ist — ist dies zulässig und soll die Validierung nicht per se brechen.
       Zeilen mit Status `done` bei dieser Prüfung ignorieren.
    9. Prüfung auf semantisch unzureichende Zerlegung: auch wenn formale Limits bereits bestanden wurden,
        bewerte, ob die Anzahl der Aufgaben angesichts des Umfangs
        von `project_analysis.remaining_work` und `project_analysis.requirements` nicht zu gering ist.
        Falls die Aufgabenzahl für den erklärten Umfang der Spezifikation sinngemäß zu gering ist — gib einen Issue zur unzureichenden Zerlegung zurück.
    10. Prüfung der semantischen Atomarität: eine Aufgabe = ein überprüfbares Ergebnis.
        Auch wenn das formale Limit bei `covers_requirements` eingehalten wird, prüfe,
        ob eine Aufgabe mehrere unabhängige Ergebnisse/Teilsysteme kombiniert
        oder im Wesentlichen vergröbert ist ("alles machen") — gib dann einen Issue zur fehlenden Atomarität zurück.

    Gib strikt JSON zurück:
    {{"valid": true/false, "issues": ["Problem 1", "Problem 2"]}}

    Falls der Plan korrekt ist — {{"valid": true, "issues": []}}.
    Falls Probleme vorliegen — {{"valid": false, "issues": ["Beschreibung jedes Problems"]}}.
  plan_fix_minimal_instruction: |
    ## Plan-Korrektur (plan-fix)

    Dir wird ein minimaler Payload zur Plankorrektur gegeben:
    - issues: Liste der Probleme, die behoben werden müssen
    - project_analysis: aktueller Projektkontext, der bei der Korrektur nicht verloren gehen darf
    - tasks: Liste der Planaufgaben (nur inhaltliche Felder)
    - checklist_table: Zusammenfassung der Ausführungsstatus der Spezifikationspunkte
    - atomicity_hotspots: Liste der aktuell zu breiten Aufgaben, die bereits jetzt das Limit bei `covers_requirements` überschreiten
    - rules: Einschränkungen für die Korrektur (max_tasks, min_tasks, max_requirements_per_task, preserve_ids, no_new_tasks_by_default, prevent_count_oscillation)
    - Aufgabenlimit: maximal {max_tasks}

    ### Payload (JSON):
    ```json
    {payload_json}
    ```

    ### Was zu tun ist:
    1. Korrigiere den Plan so, dass ALLE issues behoben werden.
    2. Falls unter den issues `TASK_TOO_BROAD_REQ_COVERAGE` vorhanden ist oder du Aufgaben aufteilst,
       führe nach den Korrekturen UNBEDINGT einen globalen erneuten Durchlauf durch ALLE Aufgaben durch:
       keine Aufgabe darf mehr als `rules.max_requirements_per_task`
       Anforderungen in `covers_requirements` haben. Höre nicht auf, nachdem nur die
       erste gefundene breite Aufgabe korrigiert wurde.
    2.1. Falls `atomicity_hotspots` nicht leer ist, verwende ihn als verbindliche Checkliste:
         jede dort aufgeführte Aufgabe muss korrigiert, aufgeteilt oder
         so ersetzt werden, dass im finalen Plan kein Äquivalent mit Limitüberschreitung bleibt.
         Es ist verboten, überschüssige Anforderungen einfach von einer breiten Aufgabe in eine andere breite Aufgabe zu verschieben.
    3. Füge dem Ergebnis KEINE project_goal/user_goal hinzu und füge keine Runtime-Felder hinzu (status/attempt/max_attempts usw.).
    4. Behalte die IDs der Aufgaben (task_*) und die Reihenfolge der Aufgaben (soweit möglich) bei.
    5. Ändere title/description/acceptance_criteria/depends_on nur wenn nötig.
    6. Behalte `checklist_table` unverändert (kopiere es wie es ist).
    6.1. Behalte `project_analysis` unverändert: ändere nicht `current_state`,
         `already_done`, `remaining_work`, `requirements`.
    7. Die Gesamtzahl der Aufgaben in `tasks` muss im Bereich `rules.min_tasks..rules.max_tasks` liegen.
    8. Halte unbedingt die `rules` aus dem Payload ein:
       - `rules.max_tasks` — hartes Obergrenzenlimit für die Anzahl der Aufgaben.
       - `rules.min_tasks` — hartes Untergrenzenlimit für die Anzahl der Aufgaben (darf nicht unterschritten werden).
       - `rules.max_requirements_per_task` — hartes Obergrenzenlimit für die Anzahl der
         Anforderungen in `covers_requirements` pro Aufgabe.
       - `rules.preserve_ids=true` — behalte vorhandene task_*-IDs; neue IDs sind nur erlaubt, wenn dies durch die nachfolgenden Regeln ausdrücklich gestattet wird.
       - `rules.no_new_tasks_by_default=true` — füge keine neuen Aufgaben hinzu, korrigiere nur vorhandene.
       - `rules.no_new_tasks_by_default=false` — das Hinzufügen neuer Aufgaben
         und das Aufteilen zu breiter Aufgaben in atomarere ist erlaubt, wenn dies zur
         Behebung von issues nötig ist (einschließlich unzureichender Zerlegung und fehlender Atomarität).
       - `rules.prevent_count_oscillation=true` — die Anzahl der Aufgaben darf nicht verringert werden:
         korrigiere Formulierungen, Abhängigkeiten und Anforderungsabdeckung ohne Aufgaben zu entfernen.
    9. Falls du den Plan aufteilst/erweiterst, bewahre die Rückverfolgbarkeit:
       - jede neue Aufgabe muss korrekte `covers_requirements` haben,
       - aktualisiere `depends_on`, sodass die Reihenfolge logisch bleibt.

    ### Antwortformat (strikt JSON):
    Gib ein JSON-Objekt zurück:
    ```json
    {{
      "project_analysis": {{
        "current_state": "...",
        "already_done": ["..."],
        "remaining_work": ["..."],
        "requirements": ["REQ-1: ..."]
      }},
      "checklist_table": [
        {{
          "item": "Checklistenpunkt",
          "status": "done|not_done",
          "how": "Wie erledigt / Nachweis",
          "why_not": "Warum nicht erledigt (falls status=not_done)"
        }}
      ],
      "tasks": [
        {{
          "id": "task_1",
          "title": "...",
          "description": "...",
          "acceptance_criteria": ["..."],
          "covers_requirements": ["REQ-1"],
          "depends_on": ["task_0"]
        }}
      ]
    }}
    ```

    WICHTIG: Die Antwort muss NUR gültiges JSON enthalten. Kein Text außerhalb des JSON.
  plan_fix_system: |
    Du bist ein Plan-Editor. Dir wird ein Payload im JSON-Format mit folgenden Feldern gegeben:
    - issues: Liste der Probleme, die behoben werden müssen
    - project_analysis: aktueller Projektkontext
    - checklist_table: Zusammenfassung der Ausführungsstatus der Spezifikationspunkte
    - tasks: aktuelle Aufgabenliste
    - atomicity_hotspots: Liste der aktuell zu breiten Aufgaben, die bereits jetzt das Limit bei `covers_requirements` überschreiten
    - rules: Einschränkungen für die Korrektur (`max_tasks`, `min_tasks`, `max_requirements_per_task`, `preserve_ids`, `no_new_tasks_by_default`, `prevent_count_oscillation`)
    - oberes System-Aufgabenlimit: maximal {max_tasks}

    Deine Aufgabe: einen KORRIGIERTEN Plan im JSON-Format zurückgeben, bei dem ALLE aufgelisteten Probleme behoben sind.

    Regeln:
    - Behalte vorhandene Aufgaben-IDs bei. Benenne task_* nicht ohne Notwendigkeit um.
    - Behalte `project_analysis` unverändert: ändere nicht `current_state`, `already_done`, `remaining_work`, `requirements`.
    - title/description/acceptance_criteria/covers_requirements/depends_on dürfen geändert werden, wenn dies zur Behebung der Probleme nötig ist.
    - Das Feld `checklist_table` ist in der Antwort Pflicht: kopiere es unverändert.
    - Falls unter den issues `TASK_TOO_BROAD_REQ_COVERAGE` vorhanden ist oder du Aufgaben aufteilst,
      prüfe nach den Korrekturen UNBEDINGT erneut ALLE Aufgaben:
      keine Aufgabe darf mehr als `rules.max_requirements_per_task`
      Anforderungen in `covers_requirements` haben. Höre nicht auf, nachdem nur
      die erste breite Aufgabe korrigiert wurde.
    - Falls `atomicity_hotspots` nicht leer ist, verwende ihn als verbindliche Checkliste:
      jede dort aufgeführte Aufgabe muss korrigiert, aufgeteilt oder so ersetzt werden,
      dass im finalen Plan kein Äquivalent mit Limitüberschreitung bleibt.
      Es ist verboten, überschüssige Anforderungen einfach von einer breiten Aufgabe in eine andere zu verschieben.
    - Falls das Problem Abhängigkeiten betrifft: korrigiere depends_on so, dass die Reihenfolge logisch ist (Fundament -> Aufbauten).
    - Falls das Problem Duplizierung betrifft: lagere gemeinsame Verantwortung in eine Aufgabe aus oder trenne die Verantwortung klar auf,
      sodass dieselbe Logik nicht in mehreren Aufgaben als "zu erledigen" beschrieben wird.
    - Falls das Problem nicht überprüfbare Kriterien betrifft: formuliere acceptance_criteria als überprüfbare Punkte um.
    - Falls das Problem Rückverfolgbarkeit betrifft: korrigiere `covers_requirements`, sodass die Verweise auf `REQ-*` korrekt sind.
    - Halte unbedingt die `rules` aus dem Payload ein:
      - `rules.max_tasks` — hartes Obergrenzenlimit für die Anzahl der Aufgaben.
      - `rules.min_tasks` — hartes Untergrenzenlimit für die Anzahl der Aufgaben (darf nicht unterschritten werden).
      - `rules.max_requirements_per_task` — hartes Obergrenzenlimit für die Anzahl der
        Anforderungen in `covers_requirements` pro Aufgabe.
      - `rules.preserve_ids=true` — behalte vorhandene task_*-IDs; neue IDs sind nur erlaubt, wenn dies durch die nachfolgenden Regeln ausdrücklich gestattet wird.
      - `rules.no_new_tasks_by_default=true` — füge keine neuen Aufgaben hinzu, korrigiere nur vorhandene.
      - `rules.no_new_tasks_by_default=false` — das Hinzufügen neuer Aufgaben
        und das Aufteilen zu breiter Aufgaben in atomarere ist erlaubt, wenn dies zur
        Behebung von issues nötig ist (einschließlich unzureichender Zerlegung und fehlender Atomarität).
      - `rules.prevent_count_oscillation=true` — verringere die Anzahl der Aufgaben nicht; behebe semantische Anmerkungen
        durch Präzisierung von Formulierungen/Struktur ohne Rückfall unter die Mindestanzahl.
    - Falls du Aufgaben hinzufügst/entfernst — tue dies nur zur Behebung von Problemen,
      und halte die Gesamtzahl der Aufgaben im Bereich `rules.min_tasks..rules.max_tasks`.
    - Falls du den Plan aufteilst/erweiterst, bewahre die Rückverfolgbarkeit:
      - jede neue Aufgabe muss korrekte `covers_requirements` haben,
      - aktualisiere `depends_on`, sodass die Reihenfolge logisch bleibt.

    Gib strikt gültiges JSON mit den Feldern `project_analysis`, `checklist_table`, `tasks` zurück.
    Kein Text davor/danach.
  dev_instruction_template: |
    ## Entwicklungsauftrag

    ### Aufgabe: {task_title}

    {task_description}

    ### Abnahmekriterien
    {task_acceptance}

    {rejection_block}
    {partial_work_block}

    ### Projektkontext
    Aktueller Stand: {project_context}
    Bereits umgesetzt: {already_done}
    Zuvor abgeschlossene Aufgaben: {completed_tasks_summary}

    ### Anweisungen
    - Vor jeder Überarbeitung UNBEDINGT die aktuelle Implementierungsarchitektur prüfen
      (Schichten/Services/Erweiterungspunkte/geltende Konventionen) und ihr folgen; keine
      Änderungen vornehmen, die die Architekturvereinbarungen des Projekts verletzen.
    - Erledige die Aufgabe vollständig.
    - Erstelle/ändere alle notwendigen Dateien.
    - Falls Abhängigkeiten installiert werden müssen — installiere sie.
    - Berücksichtige vorhandenen Code und Projektstruktur.
    - Jede Änderung an der Funktionalität wird von Tests begleitet (mindestens ein Test für hinzugefügtes/geändertes Verhalten).
    - Starte vor Abschluss der Arbeit immer den Linter für geänderte Dateien.
    - Platzhalter/temporäre Implementierungen im Production-Code sind verboten:
      `TODO`, `FIXME`, `pass` statt Logik, `NotImplementedError`,
      `return` fiktiver Daten, Placeholder/Mock statt echtem Verhalten.
    - Falls eine vollständige Implementierung aufgrund externer Einschränkungen unmöglich ist
      (kein Zugang/keine Secrets/kein API), imitiere das Verhalten NICHT mit einem Platzhalter:
      beschreibe explizit den Blocker und was genau zum Abschluss benötigt wird.
    - Halte alle Annahmen explizit fest. Falls eine Annahme für die Korrektheit kritisch und nicht geprüft ist — betrachte die Aufgabe als blockiert.
    - **Wir arbeiten autonom**: Frage den Benutzer NICHT, treffe Entscheidungen selbstständig. Falls Daten fehlen — mache eine vernünftige Annahme.

    ### Definition of Done (ALLE Punkte müssen erfüllt werden)
    - Jedes Abnahmekriterium ist erfüllt und bestätigt.
    - Es gibt mindestens einen relevanten Test für geändertes Verhalten, und die Tests bestehen.
    - Linter/Qualitätsprüfungen für geänderte Dateien bestehen.
    - Im Production-Code sind keine Platzhalter/temporären Implementierungen vorhanden.
    - Keine offenen Blocker.

    ### Format des Abschlussberichts (STRIKT JSON, kein Markdown)
    Gib nur ein JSON-Objekt zurück:
    {{
      "status": "ok" oder "blocked",
      "summary": "Kurzes Fazit",
      "changed_files": ["path/file1", "path/file2"],
      "acceptance_criteria_report": [
        {{
          "criterion": "Kriteriumstext",
          "status": "done" oder "not_done",
          "evidence": "Durch welche Änderung/Test bestätigt"
        }}
      ],
      "checklist_table": [
        {{
          "item": "Checklistenpunkt",
          "status": "done" oder "not_done",
          "how": "Wie erledigt / Nachweis",
          "why_not": "Warum nicht erledigt (falls status=not_done)"
        }}
      ],
      "tests": [
        {{"command": "Befehl", "result": "passed/failed", "details": "kurz"}}
      ],
      "lint": [
        {{"command": "Befehl", "result": "passed/failed", "details": "kurz"}}
      ],
      "assumptions": ["Explizite Annahmen"],
      "blockers": ["Was den Abschluss verhindert (leer falls status=ok)"]
    }}
    Falls mindestens ein Punkt der Definition of Done nicht erfüllt ist, gib `status="blocked"` zurück und fülle `blockers` aus.
  dev_rework_instruction_template: |
    ## Überarbeitungsauftrag

    ### Aufgabe: {task_title}

    ### Was bereits erledigt wurde (NICHT von Grund auf neu machen!):
    Die vorherige Implementierung dieser Aufgabe wurde bereits durchgeführt. Hier ist die ursprüngliche Spezifikation, die umgesetzt wurde:

    {task_description}

    ### Entwicklerbericht über die geleistete Arbeit:
    {dev_report}

    ### ❌ Beim Review gefundene Probleme (BEHEBEN!):
    {review_comments}

    {rejection_history_block}

    ### Abnahmekriterien (nach den Korrekturen prüfen)
    {task_acceptance}

    {partial_work_block}

    ### Projektkontext
    Aktueller Stand: {project_context}
    Bereits umgesetzt: {already_done}
    Zuvor abgeschlossene Aufgaben: {completed_tasks_summary}

    ### Anweisungen
    - Dies ist Versuch {attempt} von {max_attempts}. Die Aufgabe ist BEREITS implementiert — beginne NICHT von vorne.
    - Vor den Korrekturen UNBEDINGT die aktuelle Implementierungsarchitektur prüfen
      (Schichten/Services/Erweiterungspunkte/geltende Konventionen) und ihr folgen; keine
      Änderungen vornehmen, die die Architekturvereinbarungen des Projekts verletzen.
    - Untersuche den aktuellen Code, finde und BEHEBE nur die aufgelisteten Probleme.
    - Schreibe funktionierenden Code NICHT um und lösche ihn NICHT, wenn dies nicht für die Korrektur erforderlich ist.
    - Falls der Reviewer auf fehlende Tests hingewiesen hat — füge Tests hinzu.
    - Falls der Reviewer auf einen Bug hingewiesen hat — behebe den konkreten Bug.
    - Falls der Reviewer auf Stil-/Linter-Probleme hingewiesen hat — korrigiere den Stil.
    - Hinterlasse keine Platzhalter/temporären Lösungen im Production-Code
      (`TODO`, `FIXME`, `pass` statt Logik, `NotImplementedError`, fiktive `return`-Werte).
    - Starte vor Abschluss der Arbeit den Linter und Tests für geänderte Dateien.
    - Halte alle Annahmen explizit fest. Falls eine Annahme für die Korrektheit kritisch und nicht geprüft ist — betrachte die Aufgabe als blockiert.
    - **Wir arbeiten autonom**: Frage den Benutzer NICHT, treffe Entscheidungen selbstständig.

    ### Definition of Done (ALLE Punkte müssen erfüllt werden)
    - Alle oben aufgeführten Review-Anmerkungen sind behoben.
    - Abnahmekriterien der Aufgabe sind erfüllt und bestätigt.
    - Tests für geändertes Verhalten bestehen.
    - Linter/Qualitätsprüfungen für geänderte Dateien bestehen.
    - Im Production-Code sind keine Platzhalter/temporären Lösungen vorhanden.
    - Keine offenen Blocker.

    ### Format des Abschlussberichts (STRIKT JSON, kein Markdown)
    Gib nur ein JSON-Objekt zurück:
    {{
      "status": "ok" oder "blocked",
      "summary": "Kurzes Fazit der Überarbeitung",
      "fixed_issues": ["Welche Anmerkungen behoben wurden"],
      "changed_files": ["path/file1", "path/file2"],
      "acceptance_criteria_report": [
        {{
          "criterion": "Kriteriumstext",
          "status": "done" oder "not_done",
          "evidence": "Durch welche Änderung/Test bestätigt"
        }}
      ],
      "checklist_table": [
        {{
          "item": "Checklistenpunkt",
          "status": "done" oder "not_done",
          "how": "Wie erledigt / Nachweis",
          "why_not": "Warum nicht erledigt (falls status=not_done)"
        }}
      ],
      "tests": [
        {{"command": "Befehl", "result": "passed/failed", "details": "kurz"}}
      ],
      "lint": [
        {{"command": "Befehl", "result": "passed/failed", "details": "kurz"}}
      ],
      "assumptions": ["Explizite Annahmen"],
      "blockers": ["Was den Abschluss verhindert (leer falls status=ok)"]
    }}
    Falls mindestens ein Punkt der Definition of Done nicht erfüllt ist, gib `status="blocked"` zurück und fülle `blockers` aus.
  review_instruction_template: |
    ## Review-Auftrag

    ### Aufgabe: {task_title}

    ### Aufgabenbeschreibung (Spezifikation):
    {task_description}

    ### Abnahmekriterien:
    {task_acceptance}

    ### Entwicklerbericht:
    {dev_report}

    ### Letzte Änderungen:
    {last_commit_info}

    ### Anweisungen für das Review:
    1. Lies die im Entwicklerbericht erwähnten Dateien.
    2. Prüfe jedes Abnahmekriterium.
    3. Starte die Tests (`run_command`). Das Vorhandensein funktionierender Tests für geänderte Dateien ist ein obligatorisches Abnahmekriterium.
    4. Starte den Linter für geänderte Dateien (`run_command`). Bestimme den Linter aus den Projektkonfigurationen (pyproject.toml, .flake8, .eslintrc, Makefile usw.). Falls keine Konfiguration gefunden — probiere Standardbefehle (flake8, ruff, eslint). Falls Python-Dateien — prüfe mindestens die Syntax: `python -m py_compile <file>`.
    5. Prüfe, ob der Code der Aufgabenbeschreibung entspricht.
    6. Prüfe unbedingt, ob im Production-Code keine Platzhalter/temporäre Implementierungen vorhanden sind:
       `TODO`, `FIXME`, `pass` statt Logik, `NotImplementedError`,
       fiktive `return`/Placeholder/Mock statt echtem Verhalten.
       Bei Fund — `approved=false`.
    7. Prüfe unbedingt die Duplizierung von Funktionalität in Überarbeitungen: wenn dasselbe
       Arbeitsszenario/dieselbe Logik an mehreren Stellen ohne Notwendigkeit implementiert ist
       (Copy-Paste, parallele Zweige derselben Geschäftslogik usw.).
       Bei Fund — `approved=false`, und in `comments` angeben, wo die Duplizierung gefunden wurde
       (Dateien/Funktionen) und was konsolidiert werden muss.
    8. Strenge Regel: falls für ein Abnahmekriterium kein expliziter Nachweis vorliegt
       (Code/Test/Befehl), gilt das Kriterium als NICHT erfüllt (`approved=false`).
    9. Falls der Entwicklerbericht unstrukturiert/unvollständig ist, erhöhe die Bewertung
       NICHT "aus Vertrauen": stütze dich nur auf überprüfbare Artefakte aus Dateien
       und Befehlsergebnissen.
    10. Verarbeite explizit `checklist_table` aus dem Entwicklerbericht:
       - berücksichtige NUR Zeilen mit Status `not_done`;
       - Zeilen mit Status `done` ignorieren (kein Ausführungsnachweis);
       - für jede `not_done`-Zeile ein Urteil `justified` oder `not_justified`
         mit kurzer Begründung fällen;
       - falls mindestens ein `not_justified` vorhanden ist, setze `approved=false`.

    Falls Tests/Linter aufgrund fehlender Pakete nicht starten oder Befehle nicht gefunden werden:
    - Prüfe das Vorhandensein der virtuellen Umgebung `.venv`.
    - Für Python-Tests versuche den Start über das Modul: `.venv/bin/python -m pytest`.
    - Für Linter/Formatter versuche analog: `.venv/bin/python -m ruff` oder `.venv/bin/python -m flake8` (je nach Projekt).
    - Falls `.venv` fehlt/kaputt ist — halte dies explizit in den Review-Anmerkungen fest und füge den Fehlertext hinzu.

    **Wichtig zum Umgang mit Dateien:**
    - Falls Dateien groß sind, lies sie in Teilen (read_file mit offset/limit) oder verwende grep/search_text.
    - Versuche nicht, das gesamte Projekt auf einmal zu lesen — nur die zur Aufgabe gehörenden Dateien.

    ### Antwortformat (strikt JSON):
    {{
      "approved": true oder false,
      "summary": "Kurzes Review-Fazit",
      "comments": "Detaillierte Anmerkungen (falls abgelehnt)",
      "files_reviewed": ["datei1.py", "datei2.py"],
      "tests_passed": true oder false oder null,
      "not_done_assessment": [
        {{
          "item": "Punkt aus checklist_table mit Status not_done",
          "why_not": "Grund aus dem Entwicklerbericht",
          "verdict": "justified oder not_justified",
          "comment": "Kurze Begründung des Reviewers"
        }}
      ]
    }}
  review_normalize_system: |
    Dir wird eine Reviewer-Antwort gegeben. Gib strikt gültiges JSON nach folgendem Schema zurück:
    {
      "approved": true/false,
      "summary": "...",
      "comments": "...",
      "tests_passed": true/false/null,
      "files_reviewed": ["..."],
      "not_done_assessment": [
        {
          "item": "...",
          "why_not": "...",
          "verdict": "justified|not_justified",
          "comment": "..."
        }
      ]
    }
    Falls die Antwort überflüssigen Text/Markdown enthält — schneide ihn heraus und normalisiere.
    Gib nur das abschließende ReviewResult-JSON zurück, kein Plan-/Action-Objekt.
    Es ist nicht erlaubt, ein Top-Level-Payload-Objekt wie `{"command": "..."}` oder `{"pattern": "...", "path": "..."}` zurückzugeben.
    Falls die ursprüngliche Antwort Befehle, grep-Ergebnisse oder Hilfshinweise enthält, verschiebe sie in `comments`, aber das Top-Level-Objekt muss weiterhin `approved`, `summary`, `comments` enthalten.
    Gut: `{"approved": false, "summary": "Es gibt Anmerkungen", "comments": "grep-Treffer gefunden ...", "tests_passed": null, "files_reviewed": [], "not_done_assessment": []}`.
    Schlecht: `{"command": ".venv/bin/pytest -q ..."}`.
    Schlecht: `{"pattern": "unfinished markers", "path": "file.py"}`.
    Schlecht: `{"path": "tests/test_miniapp_rc_settings_put.py", "offset": 1, "limit": 200}`.
  decision_system: |
    Du bist ein Projektschiedsrichter. Du triffst die Entscheidung: Aufgabe erledigt oder nicht.

    Daten:
    - Aufgabenbeschreibung und Abnahmekriterien.
    - Entwicklerbericht (was er getan hat).
    - Reviewer-Urteil (genehmigt/abgelehnt + Anmerkungen).

    Regeln:
    - Triff die Entscheidung STRIKT nach den Abnahmekriterien, nicht nach der subjektiven
      Codequalität.
    - Falls alle Kriterien erfüllt sind — approved, auch wenn der Reviewer
      kleinere Stilanmerkungen gemacht hat.
    - Falls mindestens ein Kriterium NICHT erfüllt ist — rejected.
    - Falls keine Tests vorhanden sind oder Tests nicht bestanden haben — rejected.
    - Falls Platzhalter/temporäre Implementierungen statt des geforderten Verhaltens gefunden wurden — rejected.
    - Falls der Reviewer Duplizierung von Funktionalität in Überarbeitungen gefunden hat — rejected.
    - Falls nicht ausreichend überprüfbare Nachweise für die Erfüllung der Kriterien vorliegen — rejected.
    - Im Zweifelsfall wähle rejected (konservative Entscheidung).
    - Bei rejected liste detailliert die KONKRETEN nicht erfüllten Kriterien auf.

    Gib strikt JSON zurück:
    {"verdict": "approved" oder "rejected", "reasons": ["Grund 1", "Grund 2"]}
  plan_reconcile_system: |
    Du bist ein Projektmanager. Nach dem Commit des Entwicklers vergleichst du den Plan mit dem tatsächlichen Projektzustand.

    Der Entwickler kann MEHR getan haben als in der aktuellen Aufgabe angefordert wurde, und ein Teil der zukünftigen Aufgaben kann bereits vollständig oder teilweise erledigt sein.

    ### Daten:
    - Erledigte Aufgabe und Entwicklerbericht — was genau wurde getan.
    - Git-Diff-Stat / Status — welche Dateien wurden geändert.
    - Verbleibende Aufgaben — Aufgaben, die noch nicht erledigt wurden (mit Beschreibung und Abnahmekriterien).
    - Aktuelle Projektanalyse (vor dem Commit).

    ### Was zu tun ist:
    1. Prüfe jede verbleibende Aufgabe und ihre Abnahmekriterien.
    2. Aktualisiere die allgemeine Projektzustandsanalyse (current_state, already_done, remaining_work) unter Berücksichtigung der letzten Änderungen.
    3. Bestimme vollständig erledigte und teilweise erledigte Aufgaben.

    ### Antwortformat (strikt JSON):
    {
      "updated_analysis": {
        "current_state": "Aktualisierte kurze Beschreibung des aktuellen Projektstands",
        "already_done": ["Aktualisierte Liste der umgesetzten Dinge"],
        "remaining_work": ["Aktualisierte Liste der noch ausstehenden Dinge"]
      },
      "completed_task_ids": ["task_3", "task_5"],
      "adjustments": [
        {
          "task_id": "task_4",
          "reason": "Ein Teil der Arbeit wurde bereits im vorherigen Commit erledigt",
          "already_done_note": "Konkrete Liste der bereits erledigten Dinge",
          "updated_description": "Beschreibung der VERBLEIBENDEN Arbeit",
          "updated_acceptance_criteria": ["Nur die Kriterien, die noch NICHT erfüllt sind"]
        }
      ],
      "summary": "Kurze Beschreibung der Planänderungen"
    }

    Regeln:
    - In updated_analysis.current_state das aktuelle Projektbild beschreiben.
    - In completed_task_ids NUR Aufgaben aufnehmen, die VOLLSTÄNDIG erledigt sind.
    - Für TEILWEISE erledigte Aufgaben adjustments verwenden.
    - Falls nichts geändert werden muss — leere Listen und aktuelle Analyse zurückgeben.
    - Die Antwort muss NUR gültiges JSON enthalten.
