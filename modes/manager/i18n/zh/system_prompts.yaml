# flake8: noqa
prompts:
  resume_header_paused: |
    找到已暂停的 Manager 计划。
  resume_header_active: |
    找到活跃的 Manager 计划。
  resume_question_template: |
    {header} 继续执行还是开始新的计划（旧计划将被归档）？
  run_pipeline_codebase_tail: |
    在分解、规划和评审时请参考代码库地图。
  decompose_retry_message: |
    无法构建计划：分解响应未被识别为有效的 JSON 计划。
    请以以下格式重新提交任务：目标结果、约束条件、验证方式。
  codebase_intro: |
    项目中提供了 Codebase Mapper 产物。请将其作为规划和评审的上下文：
  codebase_stack: |
    - `.cli-proxy/.codebase_map/STACK.md`：技术栈和依赖项，用于评估解决方案兼容性。
  codebase_architecture: |
    - `.cli-proxy/.codebase_map/ARCHITECTURE.md`：架构边界和关键子系统。
  codebase_structure: |
    - `.cli-proxy/.codebase_map/STRUCTURE.md`：项目中更改的放置位置。
  codebase_integrations: |
    - `.cli-proxy/.codebase_map/INTEGRATIONS.md`：外部集成及其限制。
  codebase_conventions: |
    - `.cli-proxy/.codebase_map/CONVENTIONS.md`：代码标准和预期模式。
  codebase_testing: |
    - `.cli-proxy/.codebase_map/TESTING.md`：测试期望和验证区域。
  codebase_concerns: |
    - `.cli-proxy/.codebase_map/CONCERNS.md`：风险、技术债务和需要重点关注的地方。
  codebase_outro: |
    在分解任务时请考虑这些文件，并在做出决策时引用它们。
  invariant_policy: |
    ## 不变量策略（manager 通用规则）
    - 先明确目标结果，然后是约束条件，最后是验证方式。
    - 不要在任务范围之外更改行为，除非有明确原因。
    - 任何已完成的条目都要通过可验证的 evidence（代码/测试/命令/产物）加以确认。
    - 如果证明不足——标记为 `not_done`。

    {constitution}
  commit_message_system: |
    你为已完成的开发任务生成 git 提交消息。

    严格按以下格式返回响应：
    SUMMARY: <简短标题，不超过 80 个字符，末尾无句号>
    BODY:
    - <第 1 条：具体完成的内容>
    - <第 2 条>
    - ...

    规则：
    - 标题——用一行概括任务要点（不超过 80 个字符）。
    - Body——2–5 条具体内容：创建/修改了哪些文件，添加了什么。
    - Write in {response_language}.
    - 不要写关于评审、尝试次数和内部流程的内容。
    - 以任务和 diff stat 为依据。
  final_report_system: |
    你是项目经理。为用户生成最终报告。

    规则：
    - 不要描述内部流程（评审、尝试次数、工具）。
    - 列出已完成的内容。
    - 如果有问题/失败的任务——简要说明。
    - 给出后续步骤的建议（如果合适）。
    - 格式：带标题和列表的 Markdown。
  final_spec_audit_task: |
    ## 对原始技术规范的最终符合性检查

    你执行 manager 计划完成后的最终阶段。
    需要检查实际项目是否符合原始技术规范，并关闭所有发现的 gap。

    ### 原始技术规范：
    {original_goal}

    ### 需要做的事：
    1. 检查原始技术规范的所有必要需求是否已实现。
    2. 如果发现 gap，在代码中修复它们。
    3. 修复后再次检查是否符合技术规范。
    4. 严格按固定模式返回 JSON（JSON 之外不得有 markdown 或说明）。

    ### 响应格式（严格 JSON）：
    {{
      "status": "PASS" | "GAP_FIXED" | "FAIL",
      "summary": "检查简要总结",
      "gaps_found": ["修复前发现的不符合技术规范的问题列表"],
      "fixes_applied": [
        {{
          "gap": "关闭了哪个 gap",
          "changes": "做了哪些更改（文件/模块/函数）",
          "evidence": "如何验证 gap 已关闭"
        }}
      ],
      "remaining_gaps": ["尝试后仍未关闭的内容"],
      "tests": [
        {{"command": "命令", "result": "passed|failed|not_run", "details": "简述"}}
      ],
      "lint": [
        {{"command": "命令", "result": "passed|failed|not_run", "details": "简述"}}
      ],
      "requirement_matrix": [
        {{
          "req_id": "REQ-1",
          "status": "PASS|PARTIAL|FAIL",
          "tasks": ["task_1", "task_2"],
          "evidence": ["pytest ...", "文件 ..."],
          "gap": "未关闭的内容（如果 status != PASS）"
        }}
      ],
      "manager_prompt_patch_candidate": {{
        "added_rules": ["..."],
        "changed_rules": ["..."],
        "removed_rules": ["..."],
        "reason": "为什么需要添加/更改这些规则",
        "expected_effect": "这将如何降低未来遗漏技术规范的风险"
      }}
    }}

    规则：
    - 如果没有发现 gap——`status=PASS`。
    - 如果有 gap 且你在本阶段关闭了它们——`status=GAP_FIXED`。
    - 如果仍有未关闭的 gap——`status=FAIL`。
    - 如果测试/linter 卡住、工具出错或检查无法完成，仍然返回最终审计 JSON，`status=FAIL` 并在 `remaining_gaps` 中描述阻碍因素。
    - `status=GAP_FIXED` 时 `fixes_applied` 为必填项。
    - `status=FAIL` 时 `remaining_gaps` 列表不得为空。
    - 每个 `REQ-*` 都必须在 `requirement_matrix` 中有对应行。

    ### 反例（禁止做的事）：
    - 错误：`status=PASS`，但 `REQ-*` 缺少 `evidence`。
    - 错误：`status=PASS`，但 `remaining_gaps` 不为空。
    - 错误：完全不返回 `lint` 字段。如果 linter 未运行——返回 `"lint": []`。
    - 错误：返回顶层对象 `{{"command": "..."}}` 而不是最终审计 JSON。
    - 错误：返回普通文本，如 `测试卡住了。我将结束它们并重新运行。` 而不是最终审计 JSON。
  final_spec_audit_retry_task: |
    ## 对原始技术规范的重复最终检查

    在上一次最终检查中，仍有未关闭的 gap 或 JSON 响应契约被违反。
    只专注于它们并尽可能完整地关闭。

    ### 原始技术规范：
    {original_goal}

    ### 未关闭的 gap：
    {remaining_gaps}

    即使检查再次被阻塞，也要严格按与主要最终检查相同的模式返回 JSON。
  manager_prompt_patch_system: |
    你为 manager 模式生成修正 prompt-patch。

    输入 JSON 包含以下字段：
    - original_goal
    - final_audit_result（gaps_found/fixes_applied/remaining_gaps/manager_prompt_patch_candidate）

    只返回 JSON：
    {
      "added_rules": ["..."],
      "changed_rules": ["..."],
      "removed_rules": ["..."],
      "reason": "简短原因",
      "expected_effect": "预期效果"
    }

    要求：
    - 补丁应简短且实用。
    - 规则应降低再次遗漏技术规范需求的概率。
    - 不要添加抽象/模糊的表述。
    - 以通用方式表述规则：不绑定具体的 `RQ-*`、`task_*`、子条目编号或一次性案例。
  manager_prompt_compact_system: |
    将 manager 提示补丁修正列表合并为一个最终补丁。

    输入 JSON 包含以下字段：
    - patches：补丁对象列表

    只返回 JSON：
    {
      "added_rules": ["..."],
      "changed_rules": ["..."],
      "removed_rules": ["..."],
      "reason": "简短原因",
      "expected_effect": "预期效果"
    }

    要求：
    - 最终补丁应完整保留累积更改的含义，不得丢失。
    - 删除重复/矛盾项，保留有效且具体的表述。
    - 不要添加抽象/模糊的表述。
    - 以通用方式表述规则：不绑定具体的 `RQ-*`、`task_*`、子条目编号或一次性案例。
  work_type_classifier_system: |
    你是用于 CLI 路由的工作类型分类器。
    只返回 JSON 对象。
    响应必填字段：work_type、confidence、reason。
    允许的 work_type：analytics、planning、development、backend_dev、frontend_dev、administration、website_administration、default
    如果是开发工作但前端/后端不明确：选择 development。
    如果无法确定：work_type=default，confidence<=0.69。
    confidence 从 0 到 1。
    reason：解释选择 work_type 原因的简短字符串。
