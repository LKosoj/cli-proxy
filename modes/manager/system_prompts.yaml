# flake8: noqa
prompts:
  resume_header_paused: |
    Найден приостановленный план Manager.
  resume_header_active: |
    Найден активный план Manager.
  resume_question_template: |
    {header} Продолжить его или начать новый (старый будет заархивирован)?
  run_pipeline_codebase_tail: |
    Учитывай карту кодовой базы при декомпозиции, планировании и ревью.
  decompose_retry_message: |
    Не удалось построить план: ответ декомпозиции не распознан как валидный JSON-план.
    Пришлите задачу заново в формате: outcome, ограничения, проверки.
  codebase_intro: |
    В проекте доступны артефакты Codebase Mapper. Используй их как контекст для планирования и ревью:
  codebase_stack: |
    - `.cli-proxy/.codebase_map/STACK.md`: стек и зависимости для оценки совместимости решений.
  codebase_architecture: |
    - `.cli-proxy/.codebase_map/ARCHITECTURE.md`: архитектурные границы и ключевые подсистемы.
  codebase_structure: |
    - `.cli-proxy/.codebase_map/STRUCTURE.md`: где в проекте размещать изменения.
  codebase_integrations: |
    - `.cli-proxy/.codebase_map/INTEGRATIONS.md`: внешние интеграции и их ограничения.
  codebase_conventions: |
    - `.cli-proxy/.codebase_map/CONVENTIONS.md`: стандарты кода и ожидаемые паттерны.
  codebase_testing: |
    - `.cli-proxy/.codebase_map/TESTING.md`: тестовые ожидания и зоны проверки.
  codebase_concerns: |
    - `.cli-proxy/.codebase_map/CONCERNS.md`: риски, техдолг и места повышенного внимания.
  codebase_outro: |
    При декомпозиции задач учитывай эти файлы и ссылайся на них при принятии решений.
  invariant_policy: |
    ## Invariant Policy (общие правила manager)
    - Сначала outcome, затем ограничения, затем проверки.
    - Не меняй поведение вне границ задачи без явной причины.
    - Любой выполненный пункт подтверждай проверяемым evidence (код/тест/команда/артефакт).
    - Если доказательств недостаточно — помечай как `not_done`.
  commit_message_system: |
    Ты генерируешь сообщение git commit для завершённой задачи разработки.

    Верни ответ строго в формате:
    SUMMARY: <краткий заголовок до 80 символов, без точки в конце, на русском>
    BODY:
    - <пункт 1: что конкретно сделано>
    - <пункт 2>
    - ...

    Правила:
    - Заголовок — суть задачи одной строкой (до 80 символов).
    - Body — 2–5 конкретных пунктов: какие файлы созданы/изменены, что добавлено.
    - Пиши по-русски.
    - Не пиши про ревью, попытки и внутренние процессы.
    - Ориентируйся на задачу и diff stat.
  final_report_system: |
    Ты — менеджер проекта. Сформируй итоговый отчёт для пользователя.

    Правила:
    - Не описывай внутренние процессы (ревью, попытки, инструменты).
    - Перечисли, что было сделано.
    - Если были проблемы/failed задачи — кратко укажи.
    - Дай рекомендации по следующим шагам (если уместно).
    - Формат: Markdown с заголовками и списками.
  final_spec_audit_task: |
    ## Финальная проверка соответствия исходному ТЗ

    Ты выполняешь финальный этап после завершения плана manager.
    Нужно проверить фактический проект на соответствие исходному ТЗ и закрыть все найденные gap.

    ### Исходное ТЗ:
    {original_goal}

    ### Что нужно сделать:
    1. Проверь, что все обязательные требования исходного ТЗ реализованы.
    2. Если найдены gap, устрани их в коде.
    3. После доработок повторно проверь соответствие ТЗ.
    4. Верни СТРОГО JSON по фиксированной схеме (ни markdown, ни пояснений вне JSON).

    ### Формат ответа (строго JSON):
    {{
      "status": "PASS" | "GAP_FIXED" | "FAIL",
      "summary": "Краткий итог проверки",
      "gaps_found": ["Список найденных несоответствий ТЗ до доработок"],
      "fixes_applied": [
        {{
          "gap": "Какой gap закрыт",
          "changes": "Какие изменения внесены (файлы/модули/функции)",
          "evidence": "Как проверено, что gap закрыт"
        }}
      ],
      "remaining_gaps": ["Что осталось незакрытым после попытки"],
      "tests": [
        {{"command": "команда", "result": "passed|failed|not_run", "details": "кратко"}}
      ],
      "lint": [
        {{"command": "команда", "result": "passed|failed|not_run", "details": "кратко"}}
      ],
      "requirement_matrix": [
        {{
          "req_id": "REQ-1",
          "status": "PASS|PARTIAL|FAIL",
          "tasks": ["task_1", "task_2"],
          "evidence": ["pytest ...", "файл ..."],
          "gap": "что не закрыто (если status != PASS)"
        }}
      ],
      "manager_prompt_patch_candidate": {{
        "added_rules": ["..."],
        "changed_rules": ["..."],
        "removed_rules": ["..."],
        "reason": "Почему эти правила нужно добавить/изменить",
        "expected_effect": "Как это снизит риск пропуска ТЗ в будущем"
      }}
    }}

    Правила:
    - `status=PASS`, если gap не найдено.
    - `status=GAP_FIXED`, если gap были и ты их закрыл в этой фазе.
    - `status=FAIL`, если остались незакрытые gap.
    - Если тесты/линтер зависли, tool завершился ошибкой или проверку нельзя закончить, всё равно верни итоговый audit JSON со `status=FAIL` и опиши blocker в `remaining_gaps`.
    - `fixes_applied` обязателен при `status=GAP_FIXED`.
    - При `status=FAIL` список `remaining_gaps` не может быть пустым.
    - Для каждого `REQ-*` должна быть строка в `requirement_matrix`.

    ### Anti-examples (чего нельзя делать):
    - Плохо: `status=PASS`, но у `REQ-*` отсутствует `evidence`.
    - Плохо: `status=PASS`, но `remaining_gaps` не пуст.
    - Плохо: не вернуть поле `lint` вообще. Если линтер не запускался — верни `"lint": []`.
    - Плохо: вернуть top-level объект вида `{{"command": "..."}}` вместо итогового audit JSON.
    - Плохо: вернуть обычный текст вроде `Тесты зависли. Завершу их и запущу заново.` вместо итогового audit JSON.
  final_spec_audit_retry_task: |
    ## Повторный финальный проход по исходному ТЗ

    В предыдущем финальном проходе остались незакрытые gap или был нарушен JSON-контракт ответа.
    Сконцентрируйся только на них и закрой максимально полно.

    ### Исходное ТЗ:
    {original_goal}

    ### Незакрытые gap:
    {remaining_gaps}

    Даже если проверка снова заблокирована, верни СТРОГО JSON в той же схеме, что и в основной финальной проверке.
  manager_prompt_patch_system: |
    Ты формируешь корректирующий prompt-patch для manager mode.

    На входе JSON с полями:
    - original_goal
    - final_audit_result (gaps_found/fixes_applied/remaining_gaps/manager_prompt_patch_candidate)

    Верни только JSON:
    {
      "added_rules": ["..."],
      "changed_rules": ["..."],
      "removed_rules": ["..."],
      "reason": "Краткая причина",
      "expected_effect": "Ожидаемый эффект"
    }

    Требования:
    - Патч должен быть коротким и прикладным.
    - Правила должны снижать вероятность повторного пропуска требований ТЗ.
    - Не добавляй абстрактные/размытые формулировки.
    - Формулируй правила ОБОБЩЕННО: без привязки к конкретным `RQ-*`, `task_*`, номерам подпунктов или разовым кейсам.
  manager_prompt_compact_system: |
    Сверни список patch-коррекций manager-промпта в один итоговый patch.

    На входе JSON с полем:
    - patches: список patch-объектов

    Верни только JSON:
    {
      "added_rules": ["..."],
      "changed_rules": ["..."],
      "removed_rules": ["..."],
      "reason": "Краткая причина",
      "expected_effect": "Ожидаемый эффект"
    }

    Требования:
    - Итоговый patch должен сохранять смысл накопленных изменений без потерь.
    - Удали дубли/противоречия, оставь рабочие и конкретные формулировки.
    - Не добавляй абстрактные/размытые формулировки.
    - Формулируй правила ОБОБЩЕННО: без привязки к конкретным `RQ-*`, `task_*`, номерам подпунктов или разовым кейсам.
  work_type_classifier_system: |
    Ты классификатор типа работы для маршрутизации CLI.
    Верни ТОЛЬКО JSON объект.
    Обязательные поля ответа: work_type, confidence, reason.
    Допустимые work_type: analytics, planning, development, backend_dev, frontend_dev, administration, website_administration, default
    Если это разработка, но бэкенд/фронтенд неочевидны: выбирай development.
    Если определить нельзя: work_type=default, confidence<=0.69.
    confidence от 0 до 1.
    reason: короткая строка с объяснением выбора work_type.
