schema_version: "1"
pack_id: openapi
title: HTTP API / OpenAPI
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: api
  can_combine_with: [any]
detectors:
  min_confidence: 0.55
  evidence_groups_required: [contract]
  rules:
    - id: openapi_file
      kind: any_file_matches
      pattern: "*openapi*.y*ml"
      group: contract
      weight: 0.8
      reason: OpenAPI YAML contract found.
    - id: swagger_file
      kind: any_file_matches
      pattern: "*swagger*.y*ml"
      group: contract
      weight: 0.7
      reason: Swagger/OpenAPI contract found.
    - id: openapi_json
      kind: any_file_matches
      pattern: "*openapi*.json"
      group: contract
      weight: 0.8
      reason: OpenAPI JSON contract found.
sdd:
  spec_guidance: Capture API consumers, resources, auth, request/response and error contracts.
  plan_guidance: Keep API contract and implementation changes traceable.
  task_guidance: Include contract validation and compatibility tasks.
  artifact_templates:
    - id: api-contract-plan
      output_path: api-contract-plan.md
      title: API Contract Plan
  validation_commands: []
  risk_prompts:
    - API docs can drift from implementation routes.
merge:
  priority: 20
  override_policy: additive
  conflict_keys: []
