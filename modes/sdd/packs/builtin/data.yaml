schema_version: "1"
pack_id: data
title: Data / Persistence
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: data
  can_combine_with: [any]
detectors:
  min_confidence: 0.55
  evidence_groups_required: [data]
  rules:
    - id: migrations
      kind: any_file_matches
      pattern: "**/migrations/*"
      group: data
      weight: 0.7
      reason: Migration files found.
    - id: sql_files
      kind: ext_count
      ext: .sql
      min: 1
      group: data
      weight: 0.45
      reason: SQL files found.
sdd:
  spec_guidance: Capture entities, migration constraints, consistency and rollback requirements.
  plan_guidance: Identify schema changes, migration ordering and data compatibility risks.
  task_guidance: Include migration and rollback validation.
  artifact_templates:
    - id: data-model-plan
      output_path: data-model-plan.md
      title: Data Model Plan
  validation_commands: []
  risk_prompts:
    - Data changes can be irreversible without explicit rollback planning.
merge:
  priority: 15
  override_policy: additive
  conflict_keys: []
