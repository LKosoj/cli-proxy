schema_version: "1"
pack_id: ui
title: User Interface
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: ui
  can_combine_with: [any]
detectors:
  min_confidence: 0.55
  evidence_groups_required: [surface]
  rules:
    - id: jsx_source
      kind: any_file_matches
      pattern: "src/*.jsx"
      group: surface
      weight: 0.35
      reason: JSX frontend source found.
    - id: tsx_source
      kind: any_file_matches
      pattern: "src/*.tsx"
      group: surface
      weight: 0.35
      reason: TSX frontend source found.
    - id: vue_source
      kind: any_file_matches
      pattern: "src/*.vue"
      group: surface
      weight: 0.35
      reason: Vue frontend source found.
    - id: svelte_source
      kind: any_file_matches
      pattern: "src/*.svelte"
      group: surface
      weight: 0.35
      reason: Svelte frontend source found.
    - id: static_app
      kind: any_file_matches
      pattern: "static/*.js"
      group: surface
      weight: 0.35
      reason: Static browser UI assets found.
    - id: desktop_ui
      kind: any_file_matches
      pattern: "desktop/widgets/*.py"
      group: surface
      weight: 0.35
      reason: Desktop UI widget files found.
sdd:
  spec_guidance: Capture user workflows, states, accessibility and responsive behavior.
  plan_guidance: Identify UI surfaces and required browser/desktop verification.
  task_guidance: Include UI regression checks and Playwright only for web/MiniApp changes.
  artifact_templates:
    - id: ui-surface-plan
      output_path: ui-surface-plan.md
      title: UI Surface Plan
  validation_commands: []
  risk_prompts:
    - UI changes need surface-specific verification, not only unit tests.
merge:
  priority: 15
  override_policy: additive
  conflict_keys: []
