schema_version: "1"
pack_id: ops
title: Operations / Deployment
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: ops
  can_combine_with: [any]
detectors:
  min_confidence: 0.55
  evidence_groups_required: [ops]
  rules:
    - id: dockerfile
      kind: any_file_matches
      pattern: "Dockerfile*"
      group: ops
      weight: 0.55
      reason: Dockerfile found.
    - id: compose
      kind: any_file_matches
      pattern: "*compose*.y*ml"
      group: ops
      weight: 0.45
      reason: Compose file found.
    - id: github_actions
      kind: any_file_matches
      pattern: ".github/workflows/*.yml"
      group: ops
      weight: 0.45
      reason: GitHub Actions workflow found.
    - id: systemd
      kind: any_file_matches
      pattern: "*.service"
      group: ops
      weight: 0.35
      reason: systemd unit found.
sdd:
  spec_guidance: Capture deployment, runtime config, startup/restart and observability requirements.
  plan_guidance: Identify deployment artifacts, CI gates and runtime rollback paths.
  task_guidance: Include smoke checks and operational verification.
  artifact_templates:
    - id: runbook
      output_path: runbook.md
      title: Runbook
  validation_commands: []
  risk_prompts:
    - Runtime config and deploy scripts can diverge from local development behavior.
merge:
  priority: 15
  override_policy: additive
  conflict_keys: []
