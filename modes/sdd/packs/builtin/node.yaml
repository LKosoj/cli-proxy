schema_version: "1"
pack_id: node
title: Node.js / package.json
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: node
  languages: [javascript, typescript]
  can_combine_with: [any]
detectors:
  min_confidence: 0.58
  evidence_groups_required: [manifest]
  rules:
    - id: package_json
      kind: file_exists
      path: package.json
      group: manifest
      weight: 0.7
      reason: npm package.json found.
    - id: package_scripts
      kind: json_field
      path: package.json
      field: scripts
      group: scripts
      weight: 0.35
      reason: package.json scripts found.
    - id: npm_lock
      kind: any_file_matches
      pattern: "package-lock.json"
      group: lockfile
      weight: 0.2
      reason: npm lockfile found.
    - id: ts_source
      kind: ext_count
      ext: .ts
      min: 1
      group: source
      weight: 0.25
      reason: TypeScript source found.
sdd:
  spec_guidance: Capture package type, runtime/browser target, workspace and script expectations.
  plan_guidance: Identify package scripts, module type, workspaces and frontend/backend split.
  task_guidance: Include npm/pnpm/yarn test/build validation tasks when scripts exist.
  artifact_templates:
    - id: node-package-plan
      output_path: node-package-plan.md
      title: Node Package Plan
  validation_commands:
    - npm test
  risk_prompts:
    - package.json may be tooling-only; inspect scripts and source before assuming application type.
merge:
  priority: 30
  override_policy: additive
  conflict_keys: [primary_ecosystem]
