schema_version: "1"
pack_id: esp32-embedded
title: ESP32 / ESP-IDF Firmware
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: embedded
  languages: [c, cpp]
  frameworks: [esp-idf]
  targets: [esp32]
  can_combine_with: [any]
detectors:
  min_confidence: 0.62
  evidence_groups_required: [build, embedded]
  rules:
    - id: esp_idf_cmakelists
      kind: content_regex
      path: CMakeLists.txt
      regex: "project\\.cmake|idf_component_register|IDF_PATH"
      group: build
      weight: 0.65
      reason: ESP-IDF CMake markers found.
    - id: sdkconfig
      kind: file_exists
      path: sdkconfig
      group: embedded
      weight: 0.55
      reason: ESP-IDF sdkconfig found.
    - id: sdkconfig_defaults
      kind: file_exists
      path: sdkconfig.defaults
      group: embedded
      weight: 0.35
      reason: ESP-IDF sdkconfig defaults found.
    - id: idf_component
      kind: any_file_matches
      pattern: "**/idf_component.yml"
      group: components
      weight: 0.4
      reason: ESP-IDF component manifest found.
    - id: partitions
      kind: any_file_matches
      pattern: "*partitions*.csv"
      group: flash
      weight: 0.25
      reason: ESP32 partition table found.
sdd:
  spec_guidance: Capture board, target chip, peripherals, timing, power, and update constraints.
  plan_guidance: Model FreeRTOS tasks, components, partition layout, flashing, OTA and hardware assumptions.
  task_guidance: Include build/flash/monitor validation and hardware-in-loop checks.
  artifact_templates:
    - id: embedded-build-plan
      output_path: embedded-build-plan.md
      title: Embedded Build Plan
    - id: hardware-assumptions
      output_path: hardware-assumptions.md
      title: Hardware Assumptions
  validation_commands:
    - idf.py build
  risk_prompts:
    - Firmware validation may require connected hardware and target-specific configuration.
merge:
  priority: 35
  override_policy: additive
  conflict_keys: [primary_ecosystem]
