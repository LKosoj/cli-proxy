schema_version: "1"
pack_id: architecture
title: Architecture Baseline
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: architecture
  can_combine_with: [any]
detectors:
  min_confidence: 0.55
  evidence_groups_required: [architecture]
  rules:
    - id: architecture_doc
      kind: any_file_matches
      pattern: "**/ARCHITECTURE.md"
      group: architecture
      weight: 0.55
      reason: Architecture document found.
    - id: codebase_architecture_doc
      kind: codebase_map_contains
      text: architecture
      group: architecture
      weight: 0.45
      reason: Codebase map contains architecture context.
sdd:
  spec_guidance: Capture context, containers/components and architecturally significant requirements.
  plan_guidance: Use lightweight C4-style context/container/component views when useful.
  task_guidance: Include architecture validation tasks for boundary changes.
  artifact_templates:
    - id: c4-context
      output_path: c4-context.md
      title: C4 Context
  validation_commands: []
  risk_prompts:
    - Architecture docs must stay traceable to code map evidence.
merge:
  priority: 18
  override_policy: additive
  conflict_keys: []
