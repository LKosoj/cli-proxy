schema_version: "1"
pack_id: python
title: Python
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: python
  languages: [python]
  can_combine_with: [any]
detectors:
  min_confidence: 0.58
  evidence_groups_required: [source]
  rules:
    - id: pyproject
      kind: file_exists
      path: pyproject.toml
      group: manifest
      weight: 0.65
      reason: Python pyproject.toml found.
    - id: requirements
      kind: file_exists
      path: requirements.txt
      group: manifest
      weight: 0.45
      reason: Python requirements.txt found.
    - id: python_source
      kind: ext_count
      ext: .py
      min: 1
      group: source
      weight: 0.55
      reason: Python source files found.
sdd:
  spec_guidance: Capture package/app boundaries, runtime version, dependency and config expectations.
  plan_guidance: Identify pyproject/requirements, package layout, async boundaries, and test framework.
  task_guidance: Include targeted pytest and lint tasks based on project conventions.
  artifact_templates:
    - id: python-validation
      output_path: python-validation.md
      title: Python Validation
  validation_commands:
    - python -m pytest
  risk_prompts:
    - Python projects can be app-only, package-only, or mixed; do not infer publishability from source files alone.
merge:
  priority: 30
  override_policy: additive
  conflict_keys: [primary_ecosystem]
