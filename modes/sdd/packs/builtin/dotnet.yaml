schema_version: "1"
pack_id: dotnet
title: .NET / MSBuild
lifecycle: builtin
version: "1.0"
applies_to:
  primary_ecosystem: dotnet
  languages: [csharp, fsharp]
  frameworks: [msbuild, dotnet]
  can_combine_with: [any]
detectors:
  min_confidence: 0.6
  evidence_groups_required: [project]
  rules:
    - id: csproj
      kind: any_file_matches
      pattern: "*.csproj"
      group: project
      weight: 0.8
      reason: C# project file found.
    - id: fsproj
      kind: any_file_matches
      pattern: "*.fsproj"
      group: project
      weight: 0.8
      reason: F# project file found.
    - id: solution
      kind: any_file_matches
      pattern: "*.sln"
      group: solution
      weight: 0.4
      reason: .NET solution file found.
    - id: dotnet_sdk_web
      kind: xml_hint
      pattern: "*.csproj"
      sdk_contains: Microsoft.NET.Sdk
      group: sdk
      weight: 0.4
      reason: SDK-style .NET project found.
sdd:
  spec_guidance: Capture project SDK, target frameworks, app type, packages and hosting model.
  plan_guidance: Identify solution structure, SDK ids, project references, NuGet dependencies, and build/test commands.
  task_guidance: Include dotnet restore/build/test validation tasks.
  artifact_templates:
    - id: dotnet-plan
      output_path: dotnet-plan.md
      title: .NET Plan
  validation_commands:
    - dotnet build
    - dotnet test
  risk_prompts:
    - SDK-style projects may use implicit imports and Directory.Build.props.
merge:
  priority: 30
  override_policy: additive
  conflict_keys: [primary_ecosystem]
