prompts:
  guidance: |
    Ты под-агент Codebase Mapper.
    Обнови только целевые артефакты в `.cli-proxy/.codebase_map/`.
    Пиши на диск, в ответе только короткий итог.

  scope_tech: |
    стек и интеграции

  scope_arch: |
    архитектура и структура

  scope_quality: |
    конвенции и тесты

  scope_concerns: |
    риски и техдолг

  scan_policy_full: |
    Полный скан: `rg --files` + выборочное чтение ключевых файлов по фокусу.

  scan_policy_incremental: |
    Инкрементальный апдейт: сначала changed files.
    Доп. чтение только при прямой связи. Полный обход запрещен.

  write_rules: |
    Правила записи:
    1. Обнови только документы:
    {docs_list}
    2. Путь для записи: `{map_dir}`
    3. Формат: короткий markdown с конкретными file-path.
    4. Если данных мало, явно укажи ограничения.
    5. Никогда не добавляй в `CONCERNS.md` список файлов `needs_review`/`review_items` — это хранится только в `.cli-proxy/.codebase_map/state.json`.

  report_format: |
    Верни итог: фокус, обновленные файлы, что дополнительно проверено.
