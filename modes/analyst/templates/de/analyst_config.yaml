# flake8: noqa
templates:
  default:
    name: "Grundlegende Analyse auf Anfrage"
    description: "Universelle leichtgewichtige Vorlage: die Aufgabe des Benutzers analysieren und ein strukturiertes Ergebnis liefern."
    required_sections:
      - "Verständnis der Anfrage"
      - "Wichtigste Beobachtungen"
      - "Lösungsoptionen"
      - "Empfohlene Option"
      - "Risiken und Einschränkungen"
      - "Nächste Schritte"
    required_inputs:
      - "Beschreibung der Aufgabe oder Frage"
      - "Kontext: Welche Entscheidung soll auf Basis der Analyse getroffen werden"
    system_prompt_addition: |
      Bereite eine knappe, aber praxistaugliche Analyse strikt gemäß der Anfrage des Benutzers vor.
      Versuche nicht, das Ergebnis in eine vollständige Spezifikation umzuwandeln, sofern das nicht ausdrücklich gefordert wird.
      Lege den Schwerpunkt auf konkrete Maßnahmen und Prüfkriterien.

      Analytische Methode:
      - Verwende für jede Lösungsoption die Struktur: „Option → Vorteile → Nachteile → Anwendbarkeitsbedingungen".
      - Die empfohlene Option MUST eine Begründung der Wahl enthalten: warum genau diese und nicht die anderen.
    qa_prompt: |
      Prüfe, dass die Ausgabe:
      - direkt auf die Anfrage des Benutzers antwortet;
      - konkrete Empfehlungen mit Begründung enthält;
      - nicht mit überflüssigen Details überladen ist;
      - die wichtigsten Risiken und next steps festhält;
      - die empfohlene Option begründet ist und nicht nur benannt wird.

  # Target audience für spec-orientierte Templates = low-middle developer:
  # das fertige Dokument muss ohne mündliche Erläuterungen umsetzbar sein und nicht auf senior-only-Kontext setzen.
  new_spec:
    name: "Spezifikation für Neuentwicklung"
    description: "Vollständige Vorlage für eine technische Anforderung (Spezifikation) für neue Entwicklungen: Anforderungen, Architektur, Abnahme."
    required_sections:
      - "Kontext und Übersicht"
      - "Ziele und messbare Erfolgskriterien"
      - "Aufgabenbereich (In/Out)"
      - "Annahmen und Einschränkungen"
      - "Stakeholder, Rollen und Zugriffsrechte"
      - "Benutzerszenarien"
      - "Funktionale Anforderungen"
      - "Nicht-funktionale Anforderungen"
      - "Integrationen und externe Abhängigkeiten"
      - "Daten und Domänenmodell"
      - "Architekturentscheidungen und Einschränkungen"
      - "API und Verträge"
      - "Beobachtbarkeit und Betrieb"
      - "Datenrichtlinien und Datenschutz"
      - "Implementierungsplan nach Phasen"
      - "Testplan und Abnahmekriterien"
      - "Risiken und offene Fragen"
    required_inputs:
      - "Geschäftsziel oder Problem, das das Produkt löst"
      - "Zielgruppe und Hauptbenutzer"
      - "Bekannte Einschränkungen (Budget, Fristen, Technologie-Stack)"
      - "Prioritäten: Was ist für das MVP kritisch, was kann verschoben werden"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "large"
    traceability_rules:
      - "Jeder UC-xxx MUST durch mindestens einen FR-xxx abgedeckt sein"
      - "Jeder FR-xxx mit Priorität Must MUST ein Abnahmekriterium und einen Test in der Rückverfolgbarkeitsmatrix haben"
      - "Jeder API-xxx MUST an den FR-xxx gebunden sein, der ihn erfordert"
      - "Jeder NFR-xxx MUST ein messbares SLO und eine Prüfmethode haben"
      - "Wenn UC-xxx durch keinen FR abgedeckt ist — das ist eine Lücke, die MUST beseitigt werden"
    system_prompt_addition: |
      Du bist Analyst. Deine Aufgabe ist es, ein präzises, praxistaugliches Dokument zu erstellen, das umsetzbar ist.
      Vermeide allgemeine Phrasen und stelle die Überprüfbarkeit von Aussagen sicher.

      Analytische Methode — MECE-Zerlegung:
      - Zerlege den Scope in sich gegenseitig ausschließende Bereiche (Mutually Exclusive), die zusammen alles abdecken (Collectively Exhaustive).
      - Leite für jeden Bereich Benutzerszenarien ab, dann aus UC — funktionale Anforderungen.
      - Überprüfe die Abdeckung: Hat ein Scope-Bereich keinen einzigen UC — entweder UC hinzufügen oder explizit als Out ausweisen.

      Verbindliche Formatierungsregeln:
      - Schreibe so, dass man anhand des Dokuments: den Arbeitsumfang abschätzen, die Implementierung planen, ohne „Raten" umsetzen, testen und abnehmen kann.
      - Verwende, wo immer möglich, messbare Größen (Timeouts, Perzentile, RPS/Nebenläufigkeit, Limits, Aufbewahrungsfristen, Fehlercodes).
      - Verwende Bezeichner und Rückverfolgbarkeit: `UC-xxx` (Szenarien), `FR-xxx` (funktional), `NFR-xxx` (nicht-funktional), `API-xxx` (Verträge).

      Rückverfolgbarkeitsregeln (VERBINDLICH):
      - Jeder UC-xxx MUST durch mindestens einen FR-xxx abgedeckt sein.
      - Jeder FR-xxx mit Priorität Must MUST ein Abnahmekriterium und eine Zeile in der Rückverfolgbarkeitsmatrix haben.
      - Jeder API-xxx MUST an den FR-xxx gebunden sein, der ihn erfordert.
      - Am Ende des Dokuments — Rückverfolgbarkeitsmatrix: `UC | FR | API | NFR | Test/Abnahme`. Alle Must-FR sind abgedeckt.

      Abschnittsformat:
      - „Aufgabenbereich (In/Out)" als Tabelle formatieren: `Feature/Bereich | In/Out | MVP/Next | Warum | Abhängigkeiten/Einschränkungen`.
      - „Benutzerszenarien": Für jedes `UC-xxx` angeben: `Akteure`, `Vorbedingungen`, `Schritte`, `Erwartetes Ergebnis`, `Fehler/Ausnahmen` (mindestens 1 negativer Szenario für kritische Abläufe).
      - „Funktionale Anforderungen": als Liste von Anforderungen `FR-xxx` formatieren und nach Priorität `Must/Should/Could` gruppieren. Für jedes `FR-xxx` angeben:
        `Beschreibung` (1-2 Sätze), `Abnahmekriterium` (pass/fail), `Prüfung/Test` (wie prüfen), `Fehler/Validierung` (welche Fehler unter welchen Bedingungen).
      - „Nicht-funktionale Anforderungen": `NFR-xxx` und SLI/SLO-Tabelle verwenden:
        `Metrik (SLI) | Ziel (SLO) | Messfenster | 95p/99p (falls zutreffend) | Wo gemessen | Anmerkungen`.
        Angeben, was als „normale" und „Spitzenlast" gilt (in Systemtermini) und welche Degradierungen zulässig/unzulässig sind.
      - „API und Verträge": Schlüsselinterfaces im Vertragsformat `API-xxx` beschreiben. Für jeden Vertrag mindestens angeben:
        `Zweck`, `Authentifizierung/Autorisierung`, `Eingabedaten` (Schema + Beispiel), `Ausgabedaten` (Schema + Beispiel),
        `Fehler` (Codes/Fehlertypen und Bedingungen), `Idempotenz/Nebenläufigkeit` (falls zutreffend), `Limits/Kontingente` (falls zutreffend).
        Wenn das System Ereignisse/Nachrichten (asynchrone Interfaces) hat, analoge Verträge beschreiben: `Typ`, `Payload`, `Ack/Fehler`, `Reihenfolge/Wiederholungen` (falls relevant).
    qa_prompt: |
      Rückverfolgbarkeitsprüfung (BLOCKIEREND):
      - Ist jeder UC-xxx durch mindestens einen FR-xxx abgedeckt? Falls nicht — NACHARBEITEN.
      - Hat jeder Must FR-xxx ein Abnahmekriterium (pass/fail)? Falls nicht — NACHARBEITEN.
      - Ist jeder API-xxx an einen FR-xxx gebunden? Falls nicht — NACHARBEITEN.
      - Ist die Rückverfolgbarkeitsmatrix vorhanden und sind alle Must-FR abgedeckt? Falls nicht — NACHARBEITEN.

      Vollständigkeitsprüfung:
      - Jeder Abschnitt ist vorhanden und nicht leer
      - „Aufgabenbereich (In/Out)" enthält explizite In- und Out-Listen (ohne Mehrdeutigkeit)
      - „Stakeholder, Rollen und Zugriffsrechte" beschreibt Rollen, Berechtigungen und wichtige Abläufe
      - „Benutzerszenarien" decken wichtige Pfade ab (Happy Path und 1-2 negative Szenarien für kritische Funktionen)
      - „Funktionale Anforderungen" sind priorisiert (Must/Should/Could) und enthalten Prüfkriterien
      - „Nicht-funktionale Anforderungen" umfassen messbare SLO/SLI
      - „Daten und Domänenmodell" enthält Entitäten, Felder und Beziehungen
      - „API und Verträge" enthalten Payload-Beispiele und Fehlercodes
      - „Beobachtbarkeit und Betrieb" enthält Metriken/Logs/Traces, Alerts
      - „Testplan und Abnahmekriterien" enthält klare pass/fail-Kriterien für Must-Anforderungen
      Wenn etwas vage ist, konkret neu formulieren.

  audit:
    name: "Prüfbericht"
    description: "Kritische Prüfung eines bestehenden Dokuments/einer Codebasis mit Risiken und Empfehlungen."
    required_sections:
      - "Gesamtbewertung"
      - "Beobachtungen"
      - "Risiken"
      - "Empfehlungen"
      - "Nächste Schritte"
    required_inputs:
      - "Was genau geprüft wird (Datei, Modul, Projekt, Dokument)"
      - "Prüfungsschwerpunkt (Sicherheit, Architektur, Codequalität, Anforderungskonformität)"
    system_prompt_addition: |
      Du bist Prüfer. Sei kritisch, stütze dich auf Belege und hebe die wichtigsten Probleme hervor.

      Analytische Methode — Evidence-Based Audit:
      - Verwende für jede Beobachtung die Struktur: „Fakt (was gefunden, wo) → Auswirkung (was das bedeutet) → Empfehlung (was zu tun ist)".
      - Klassifiziere jede Beobachtung nach Schweregrad: Critical / Major / Minor / Info.
      - Critical und Major MUST konkrete Verweise auf Dateien/Funktionen/Zeilen enthalten.
      - Trenne bestätigte Fakten von Hypothesen — kennzeichne Hypothesen als [Überprüfung erforderlich].
    qa_prompt: |
      Prüfe, dass der Prüfbericht:
      - Jede Beobachtung enthält: Fakt + Quelle + Schweregrad + Empfehlung
      - Critical/Major-Beobachtungen verweisen auf konkrete Dateien/Funktionen
      - Fakten sind von Annahmen getrennt (Hypothesen sind gekennzeichnet)
      - Empfehlungen sind priorisiert und umsetzbar (was, wo, warum)
      Vage Formulierungen als konkrete Beobachtungen neu formulieren.

  change_spec:
    name: "Spezifikation für Änderungen"
    description: "Vorlage für Änderungen an einem bestehenden Produkt/Projekt mit repo-gegründetem Scope, Auswirkungen und Prüfung."
    required_sections:
      - "Kontext des aktuellen Systems"
      - "Bestätigte Fakten und Quellen"
      - "Änderungsziele und Erfolgskriterien"
      - "Bestätigte Änderungen nach Komponenten"
      - "Auswirkungen auf Code, Daten, API und UX"
      - "Implementation Handoff nach Komponenten und Dateien"
      - "Kompatibilität und Einschränkungen der Einführung"
      - "Risiken und offene Prüfungen"
      - "Testplan und Abnahme"
    required_inputs:
      - "Was genau geändert werden muss und warum (Geschäftsgrund)"
      - "Welche Komponenten/Module betroffen oder voraussichtlich betroffen sind"
      - "Anforderungen an Rückwärtskompatibilität"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: false
    target_size_hint: "medium"
    traceability_rules:
      - "Jede Änderung MUST an eine Komponente gebunden sein und enthalten: was wir ändern, wie wir testen, welche Kompatibilitätsbeschränkungen berücksichtigt werden"
      - "Impact-Analyse MUST alle Komponenten aus der Änderungsliste abdecken"
      - "Jede betroffene API MUST eine Beschreibung der Vertragsänderungen haben (before/after)"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    system_prompt_addition: |
      Analytische Methode — Impact-Driven Change Analysis:
      - Wende für jede Änderung die Struktur an: „Komponente/Subsystem → Bestätigtes aktuelles Verhalten → Zielverhalten → Was genau wir ändern → Wie wir prüfen".
      - Überprüfe Kaskadeneffekte: Wenn A geändert wird, was hängt von A ab? Was hängt von den Abhängigkeiten von A ab?
      - Halte den Blast Radius nur für bestätigte betroffene Bereiche fest. Füge keine Oberflächen, Integrationen, Migrationen oder Deployment-Schritte hinzu, die nicht durch Code des Projekts oder eine direkte Benutzeranfrage bestätigt sind.
      - Liste nicht alle Oberflächen des Projekts auf. Beschreibe nur die Komponenten, Dateien und Benutzerszenarien, die direkt für diese Änderung benötigt werden.
      - Wenn die Änderung lokal ist, blase das Dokument nicht zu einem allgemeinen Enterprise-Change-Plan auf.

      Schwerpunkt: minimal-invasive Änderungen, Rückwärtskompatibilität und überprüfbare Abnahmekriterien.
      Verwende das echte Repository als Source of Truth und mache das Dokument für einen Low-Middle-Entwickler ohne mündliche Erläuterungen geeignet.
    qa_prompt: |
      Rückverfolgbarkeitsprüfung (BLOCKIEREND):
      - Sind für jede Änderung angegeben: wo wir ändern, bestätigtes aktuelles/Zielverhalten, wie wir testen? Falls nicht — NACHARBEITEN.
      - Deckt die Impact-Analyse alle Komponenten aus der Änderungsliste ab? Falls nicht — NACHARBEITEN.
      Vollständigkeitsprüfung:
      - Dokument ist repo-gegründet und widerspricht dem Code nicht
      - Ausreichend für einen Low-Middle-Entwickler ohne mündliche Erläuterungen
      - Kaskadeneffekte der Änderungen sind analysiert
      - Keine erfundenen Oberflächen, Integrationen, Route/Controller/Table/Test-Dateipfade ohne Repository-Belege
      - Keine Abschnitte über nicht betroffene Projektoberflächen, wenn diese nicht durch Anfrage oder Code bestätigt sind
      - Migrationen und Deployment werden nur erwähnt, wenn sie durch bestätigte Änderungen tatsächlich erforderlich sind

  ui_change_spec:
    name: "Spezifikation für lokale UI/UX-Änderungen"
    description: "Enge repo-gegründete Vorlage für lokale Änderungen an Interface, Komponente oder Benutzerszenario."
    required_sections:
      - "Kontext und bestätigte Fakten"
      - "Bestätigte Fakten und Quellen"
      - "Zielverhalten und UX-Kriterien"
      - "Änderungen nach Komponenten und Zuständen"
      - "Betroffene Dateien, Abhängigkeiten und Einschränkungen"
      - "Implementation Handoff nach Komponenten und Dateien"
      - "Implementierungs-, Prüf- und Abnahmeplan"
      - "Offene Fragen und Risiken"
    required_inputs:
      - "Was genau in der UI/UX geändert werden muss und warum"
      - "Welche Komponente, welcher Bildschirm oder welches Benutzerszenario betroffen ist"
      - "Was im aktuellen Verhalten unbedingt nicht kaputt gehen darf"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Jede Änderung MUST an eine konkrete Komponente/einen Zustand und eine bestätigte Datei oder ein Artefakt gebunden sein"
      - "Jedes Abnahmekriterium MUST ein konkretes sichtbares Interfaceverhalten prüfen"
      - "Wenn die Rückwärtskompatibilität eines UX-Szenarios betroffen ist, MUST dies explizit beschrieben werden"
    system_prompt_addition: |
      Du erstellst eine enge, arbeitsfähige Spezifikation für lokale UI/UX-Änderungen an einem bestehenden Projekt.

      Analytische Methode:
      - Verwende für jede Änderung die Struktur: „Komponente/Zustand → Bestätigtes aktuelles Verhalten → Zielverhalten → Was wir in Markup/Logik/Styles ändern → Wie wir prüfen".
      - Konzentriere dich auf den lokalen Scope: Komponente, Bildschirm, Formular, Dropdown, Header, Menü, CTA, Zustände, responsives Verhalten.
      - Blase das Dokument nicht zu einem allgemeinen Change-Plan für Daten, API, Migrationen, Rollout oder Infrastruktur auf, wenn dies nicht durch Code des Projekts bestätigt ist.
      - Wenn Backend/API/Daten tatsächlich betroffen sind, beschreibe nur den bestätigten Einflussbereich und trenne ihn explizit vom UI-Teil.
      - Liste betroffene Oberflächen nur auf, wenn sie direkt durch das Repository bestätigt sind und tatsächlich geändert werden.
    qa_prompt: |
      Vollständigkeitsprüfung (BLOCKIEREND):
      - Sind für jede Änderung angegeben: wo wir ändern, bestätigtes aktuelles Verhalten, Zielverhalten, Abnahmekriterium.
      - Alle Empfehlungen sind repo-gegründet und an konkrete Dateien/Komponenten/Zustände gebunden.
      - Keine erfundenen Route/Controller/Table/API/Test-Dateipfade ohne Repository-Belege.
      - Dokument ist nicht mit überflüssigen Abschnitten über Migrationen, Rollout, Infrastruktur oder externe Oberflächen aufgebläht, wenn diese nicht bestätigt sind.
      - Offene Fragen sind separat ausgewiesen und nicht als fertige Lösungen getarnt.

  bugfix_spec:
    name: "Spezifikation zur Fehlerbehebung"
    description: "Enge repo-gegründete Vorlage zur Behebung eines konkreten Fehlers oder einer Regression in einem bestehenden System."
    required_sections:
      - "Kontext des Fehlers und bestätigte Symptome"
      - "Bestätigte Fakten und Quellen"
      - "Bestätigtes aktuelles Verhalten und Schadensbereich"
      - "Zielverhalten und Behebungskriterien"
      - "Behebungsplan und betroffene Dateien"
      - "Implementation Handoff nach Komponenten und Dateien"
      - "Regressionsrisiken und Prüfungen"
      - "Offene Fragen"
    required_inputs:
      - "Welcher Fehler oder welche Regression beobachtet wird"
      - "Welches Szenario nach der Behebung funktionieren soll"
      - "Was in der Nähe dieses Fehlers nicht kaputt gehen darf"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Jede Behebung MUST an ein bestätigtes Symptom und einen konkreten Codebereich gebunden sein"
      - "Jedes Abnahmekriterium MUST die Beseitigung des Fehlers und das Ausbleiben der wesentlichen Regression nachweisen"
    system_prompt_addition: |
      Konzentriere dich auf einen Fehler oder eine eng zusammenhängende Gruppe von Symptomen.
      Verwende die Struktur: „Symptom → Bestätigter Schadensbereich → Was wir beheben → Wie wir die Behebung prüfen".
      Blase das Dokument nicht zu einem allgemeinen Refactor/Change-Plan auf.
      Wenn die Grundursache nicht bestätigt ist, trenne sie von Fakten auf Symptomebene.
    qa_prompt: |
      Vollständigkeitsprüfung:
      - Symptome und bestätigter Schadensbereich sind separat beschrieben.
      - Der Behebungsplan ist an konkrete Dateien/Komponenten gebunden.
      - Es gibt Prüfkriterien für die Behebung und ein minimales Anti-Regressions-Set.
      - Keine erfundenen Grundursachen, APIs, Tabellen oder Routen ohne Repository-Belege.

  integration_change_spec:
    name: "Spezifikation für Integrationsänderungen"
    description: "Enge repo-gegründete Vorlage für Änderungen an einer externen Integration, einem API-Vertrag, Webhook oder Anbieter."
    required_sections:
      - "Kontext der Integration und bestätigte Einstiegspunkte"
      - "Bestätigte Fakten und Quellen"
      - "Aktuelles und Zielverhalten der Integration"
      - "Änderungen an Verträgen, Payload und Fehlerbehandlung"
      - "Betroffene Komponenten und Kompatibilitätseinschränkungen"
      - "Implementation Handoff nach Komponenten und Dateien"
      - "Integrationsverifikationsplan"
      - "Offene Risiken und Abhängigkeiten"
    required_inputs:
      - "Welche Integration oder welcher externe Vertrag geändert wird"
      - "Was genau sich im Datenaustausch oder Verhalten ändern soll"
      - "Welche Kompatibilitätsbeschränkungen zwingend sind"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Jede Änderung MUST an einen konkreten Integrationspunkt oder Vertrag gebunden sein"
      - "Für jeden Vertrag MUST aktuelles und Zielverhalten beschrieben sein, einschließlich Fehler"
    system_prompt_addition: |
      Fokus auf bestätigten Integrationspunkten: API-Client, Webhook-Handler, Provider-Adapter, Payload-Schema, Retry/Error-Handling.
      Erweitere das Dokument nicht zu einem allgemeinen Product-Change-Plan, wenn nur die Integrationsschicht geändert wird.
      Wenn der externe Teil nicht durch Code des Projekts bestätigt ist, kennzeichne dies explizit als [Überprüfung erforderlich].
    qa_prompt: |
      Vollständigkeitsprüfung:
      - Änderungen sind an konkrete Integrationspunkte gebunden.
      - Eingangs-/Ausgangs-Payload, Fehler und Kompatibilität sind beschrieben.
      - Keine erfundenen Endpoints/Provider/Tabellen ohne Repository-Belege.
      - Der Verifikationsplan deckt Happy Path und Fehlertoleranz ab.

  narrow_backend_change_spec:
    name: "Spezifikation für enge Backend-Änderungen"
    description: "Enge repo-gegründete Vorlage für lokale serverseitige Änderungen ohne breiten Produkt-Scope."
    required_sections:
      - "Kontext des Backend-Bereichs und bestätigte Fakten"
      - "Bestätigte Fakten und Quellen"
      - "Aktuelles und Zielverhalten der Logik"
      - "Änderungen an Services, Handlers, Daten und Verträgen"
      - "Implementation Handoff nach Komponenten und Dateien"
      - "Kompatibilität, Einschränkungen und Nebeneffekte"
      - "Implementierungs- und Prüfplan"
      - "Offene Fragen und Risiken"
    required_inputs:
      - "Welche serverseitige Logik geändert werden muss"
      - "Welche Komponente/Service/Handler betroffen ist"
      - "Welche Szenarien nicht kaputt gehen dürfen"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Jede Änderung MUST an eine bestätigte Backend-Komponente und das aktuelle Verhalten gebunden sein"
      - "Der Prüfplan MUST wichtige Nebeneffekte und Kompatibilität abdecken"
    system_prompt_addition: |
      Fokus auf lokaler Backend-Logik: Service, Handler, Controller, Domänenmodell, Validierung, interner Vertrag.
      Blase das Dokument nicht zu einem refactor-weiten oder projekt-weiten Plan auf, wenn die Änderung lokal ist.
      Wenn Daten/API betroffen sind, beschreibe nur den bestätigten Einflussbereich.
    qa_prompt: |
      Vollständigkeitsprüfung:
      - Aktuelles und Zielverhalten der Backend-Logik ist beschrieben und an Code gebunden.
      - Nebeneffekte und Kompatibilität sind explizit aufgelistet.
      - Keine erfundenen Tabellen, Endpoints, Ereignisse oder Klassen ohne Repository-Belege.
      - Der Prüfplan deckt das Hauptszenario und Regressionsbereiche ab.

  project_analysis:
    name: "Projektanalyse"
    description: "Strukturelle Analyse eines bestehenden Projekts: Architektur, Probleme, Empfehlungen, nächste Schritte."
    required_sections:
      - "Kurzzusammenfassung"
      - "Architekturbild"
      - "Technische Risiken und Engpässe"
      - "Codequalität und Testabdeckung"
      - "Priorisierende Empfehlungen"
      - "Aktionsplan für 30/60/90 Tage"
    required_inputs:
      - "Analyseziel (Refaktorisierungsentscheidung, Audit vor Release, Onboarding usw.)"
      - "Welche Aspekte des Projekts am wichtigsten sind (Architektur, Qualität, Leistung, Sicherheit)"
    system_prompt_addition: |
      Analytische Methode — ATAM-lite (Architecture Tradeoff Analysis):
      - Identifiziere die wichtigsten Architekturtreiber (Systemqualitäten, die für Stakeholder wichtig sind).
      - Bestimme für jede Architekturentscheidung: welche Qualitäten sie unterstützt, welche sie einschränkt (Tradeoff).
      - Risiken = Punkte, wo Architekturentscheidungen die deklarierten Qualitäten NICHT unterstützen.
      - Empfehlungen MUST an konkrete Risiken gebunden sein und keine allgemeinen Wünsche sein.

      Schwerpunkt: konkrete Beobachtungen und Belege aus dem Repository. Allgemeine Phrasen vermeiden.
    qa_prompt: |
      Prüfe, dass:
      - Jedes Risiko durch eine Beobachtung aus Code/Konfigurationen bestätigt ist (mit Angabe von Datei/Funktion)
      - Empfehlungen nach Impact/Aufwand priorisiert sind
      - Der 30/60/90-Plan realistisch ist und an konkrete Risiken gebunden ist
      - Keine „allgemeinen Empfehlungen" ohne Bezug zu einer Beobachtung

  bug_investigation:
    name: "Spezifikation zur Fehleruntersuchung"
    description: "Vorlage zur Defektanalyse: Reproduktion, Hypothesen, RCA, Behebungsplan und Validierung."
    required_sections:
      - "Symptome und Kontext"
      - "Reproduktionsschritte"
      - "Ursachenhypothesen"
      - "Root Cause"
      - "Behebungsplan"
      - "Prüfung und Regressionen"
    required_inputs:
      - "Beschreibung des beobachteten Verhaltens (was passiert)"
      - "Beschreibung des erwarteten Verhaltens (was passieren soll)"
      - "Reproduktionsbedingungen (Umgebung, Daten, Aktionsreihenfolge)"
    system_prompt_addition: |
      Analytische Methode — 5 Whys + Fault Tree:
      - Stelle für jedes Symptom mindestens 5 Mal „Warum?" bis du zur Grundursache gelangst.
      - Erstelle einen Ursachenbaum (Fault Tree): Wurzel = beobachtetes Symptom, Blätter = mögliche Grundursachen.
      - Gib für jede Hypothese an: wie zu bestätigen (was in Code/Logs/Daten prüfen) und wie zu widerlegen.
      - Die Grundursache MUST durch einen konkreten Beleg bestätigt sein und nicht nur „die wahrscheinlichste Hypothese" sein.

      Schwerpunkt: Ursache-Wirkungs-Zusammenhänge, nicht Aufzählung von Symptomen.
    qa_prompt: |
      Prüfe, dass:
      - Die Grundursache durch einen konkreten Beleg bestätigt ist (Datei, Zeile, Log, Zustand)
      - Die Kette „Symptom → ... → Grundursache" logisch ist und keine fehlenden Glieder hat
      - Der Behebungsplan die Grundursache beseitigt, nicht die Symptome
      - Regressionsszenarien das geänderte Verhalten abdecken

  incident_rca:
    name: "Vorfalls-RCA"
    description: "Post-Incident-Analyse: Timeline, Grundursache, Korrektur- und Vorbeugemaßnahmen."
    required_sections:
      - "Vorfallsbeschreibung"
      - "Timeline"
      - "Auswirkungen und betroffene Bereiche"
      - "Grundursache"
      - "Korrekturmaßnahmen"
      - "Vorbeugemaßnahmen"
      - "Kontrollmetriken nach Behebungen"
    required_inputs:
      - "Wann der Vorfall aufgetreten ist und wann er entdeckt wurde"
      - "Beschreibung der Auswirkungen auf Benutzer/System"
      - "Verfügbare Logs, Metriken, Alerts zum Vorfall"
    system_prompt_addition: |
      Analytische Methode — Ishikawa (Fishbone) + Swiss Cheese Model:
      - Erstelle ein Ishikawa-Diagramm: klassifiziere Ursachen nach Kategorien (People, Process, Technology, Environment).
      - Wende das Swiss Cheese Model an: bestimme, welche Schutzschichten (Monitoring, Tests, Review, Alerts) durchbrochen wurden und warum.
      - Timeline MUST enthalten: Zeitpunkt des Ereignisses, wer entdeckt hat, welche Maßnahme ergriffen wurde, Ergebnis der Maßnahme.
      - Vorbeugemaßnahmen MUST konkrete „Lücken" in den Schutzschichten schließen und keine allgemeinen Empfehlungen sein.

      Schwerpunkt: verifizierbare Fakten, keine Schuldsuche.
    qa_prompt: |
      Prüfe, dass:
      - Die Timeline vollständig ist: vom ersten Symptom bis zur vollständigen Wiederherstellung
      - Die Grundursache durch Fakten bestätigt ist und nicht einfach zugewiesen wurde
      - Jede Vorbeugemaßnahme eine konkrete „Lücke" in der Schutzschicht schließt
      - Vorbeugemaßnahmen einen Verantwortlichen und eine Frist haben (oder mit [Zuweisung erforderlich] gekennzeichnet sind)

  impact_analysis:
    name: "Änderungsauswirkungsanalyse"
    description: "Bewertung der Auswirkungen einer geplanten Änderung auf System, Daten, API, Betrieb und Tests."
    required_sections:
      - "Änderungsbeschreibung"
      - "Betroffene Subsysteme"
      - "Auswirkungen auf API/Verträge"
      - "Auswirkungen auf Daten und Migrationen"
      - "Auswirkungen auf Infrastruktur/Beobachtbarkeit"
      - "Risiken und Minderungsmaßnahmen"
      - "Prüfplan"
    required_inputs:
      - "Beschreibung der geplanten Änderung"
      - "Welche Komponenten/Module direkt betroffen sind"
      - "Gibt es Anforderungen an Rückwärtskompatibilität oder Downtime"
    system_prompt_addition: |
      Analytische Methode — FMEA-lite (Failure Mode and Effects Analysis):
      - Bestimme für jedes betroffene Subsystem mögliche Failure Modes (wie es kaputt gehen kann).
      - Bewerte für jeden Failure Mode: Severity (1-5), Likelihood (1-5), Detectability (1-5).
      - Risk Priority = Severity × Likelihood × Detectability. Konzentriere dich auf die Top-5 nach Risk Priority.
      - Für jedes Risiko aus den Top-5 MUST eine konkrete Minderungsmaßnahme vorhanden sein.

      Schwerpunkt: rückverfolgbare Abdeckung aller Einflußzonen. Kaskadenabhängigkeiten prüfen.
    qa_prompt: |
      Prüfe, dass:
      - Keine „blinden Flecken" (Daten, Rechte, Monitoring, Maßnahmen bei Ausfall)
      - Kaskadenabhängigkeiten analysiert sind (nicht nur direkte)
      - Für jedes Risiko aus den Top-5 eine Minderungsmaßnahme vorhanden ist
      - Der Prüfplan alle betroffenen Subsysteme abdeckt

  refactor_spec:
    name: "Spezifikation für Refaktorisierung"
    description: "Refaktorisierungsplan ohne Verhaltensänderung: Grenzen, Phasen, Regressionskontrolle."
    required_sections:
      - "Aktueller Zustand der Codebasis"
      - "Bestätigte Fakten und Quellen"
      - "Zielzustand"
      - "Einschränkungen und Nicht-Ziele"
      - "Betroffene Oberflächen"
      - "Änderungen nach Schichten/Komponenten"
      - "Änderungen an Persistenz/State/Config"
      - "Migration und Kompatibilität"
      - "Startup/Restore/Reconcile-Logik"
      - "Abkehr von Legacy und was genau entfernt wird"
      - "Implementierungsplan nach Phasen"
      - "Implementation Handoff nach Komponenten und Dateien"
      - "Kontrolle der Verhaltensäquivalenz"
      - "Testplan und Abnahmekriterien"
      - "Risiken und offene Fragen"
    required_inputs:
      - "Was genau refaktorisiert wird und warum (technische Schulden, Leistung, Erweiterbarkeit)"
      - "Explizite Grenzen: was NICHT in den Scope der Refaktorisierung gehört"
      - "Kriterien der Verhaltensäquivalenz (wie nachzuweisen ist, dass das Verhalten unverändert blieb)"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "large"
    traceability_rules:
      - "Jede Änderung nach Schicht/Komponente MUST eine Methode zur Prüfung der Verhaltensäquivalenz haben"
      - "Jede Phase des Plans MUST enthalten: betroffene Komponenten, Risiken, Stoppkriterium"
      - "Jede entfernte Entität MUST auf fehlende Abhängigkeiten geprüft sein"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    system_prompt_addition: |
      Du erstellst eine arbeitsfähige Spezifikation für die Refaktorisierung eines bestehenden Projekts.

      Analytische Methode — Strangler Fig Pattern + Characterization Tests:
      - Bestimme für jede Komponente: aktuelles Verhalten (Characterization) → Zielstruktur → Übergangspfad.
      - Die Refaktorisierung MUST inkrementell sein: Jede Phase lässt das System in einem funktionsfähigen Zustand.
      - Definiere für jede Phase Characterization Tests: Tests, die das aktuelle Verhalten festhalten und nach den Änderungen MUST bestehen.

      Verbindliche Regeln:
      - Source of Truth = echte Projektdateien, nicht nur die Codebase-Map;
      - Das Dokument muss für einen Low-Middle-Entwickler ohne mündliche Erläuterungen ausreichen;
      - Die Refaktorisierung darf den Scope nicht erweitern und darf das Verhalten nicht unbemerkt ändern;
      - Für jede Phase explizit betroffene Komponenten, Risiken, Prüfmethode und Stoppkriterium angeben;
      - Separat nur bestätigte betroffene Oberflächen und Artefakte festhalten, die nach der Refaktorisierung tatsächlich überprüft werden müssen;
      - Wenn ein neuer Config-Key, Fallback-Layer, Compatibility-Wrapper, eine Entität oder API vorgeschlagen wird, muss dies explizit durch Code oder Benutzeranfrage begründet sein.
    qa_prompt: |
      Rückverfolgbarkeitsprüfung (BLOCKIEREND):
      - Hat jede Phase: betroffene Komponenten, Risiken, Prüfmethode, Stoppkriterium? Falls nicht — NACHARBEITEN.
      - Ist jede entfernte Entität auf fehlende Abhängigkeiten geprüft? Falls nicht — NACHARBEITEN.
      Vollständigkeitsprüfung:
      - Bleibt eine Template-First-Spezifikation und kein allgemeines Gedankenexperiment
      - Enthält explizite Scope-Grenzen und Nicht-Ziele
      - Listet nur bestätigte betroffene Oberflächen/Artefakte auf, keine Schablonenliste
      - Legt objektive Kriterien fest für „Verhalten hat sich nicht geändert"
      - Geeignet für einen Low-Middle-Entwickler ohne mündliche Erläuterungen
      - Enthält Stopp-/Abbruchkriterien

  migration_plan:
    name: "Migrationsplan"
    description: "Vorlage für die Migration von Technologien/Schemata/Verträgen mit Phaseneinteilung und sicherem Abbruch."
    required_sections:
      - "Migrationsziele"
      - "Aktueller und Zielzustand"
      - "Übergangsstrategie"
      - "Rückwärtskompatibilitätsplan"
      - "Plan zum sicheren Abbruch"
      - "Abschlusskriterien"
    required_inputs:
      - "Was migriert wird (Technologie, Datenschema, API, Infrastruktur)"
      - "Migrationsgrund und erwartetes Ergebnis"
      - "Zulässiger Downtime und Migrationsfenster"
      - "Anforderungen an Rückwärtskompatibilität"
    system_prompt_addition: |
      Analytische Methode — Blue-Green / Canary Migration:
      - Bestimme die Übergangsstrategie: Big Bang, Blue-Green, Canary, Strangler Fig — und begründe die Wahl.
      - Definiere für jede Phase: Point of No Return, Stopp-/Abbruchkriterien, Gesundheitsmetriken.
      - Plan for failure: Beschreibe für jede Phase, was zu tun ist, wenn sie scheitert.
      - Das Szenario zum sicheren Abbruch MUST in einer Testumgebung überprüfbar sein, bevor die Produktionsmigration beginnt.

      Schwerpunkt: Downtime und Datenverlustrisiko minimieren.
    qa_prompt: |
      Prüfe, dass:
      - Die Übergangsstrategie begründet ist (warum genau dieser Ansatz)
      - Für jede Phase ein Point of No Return und Stopp-/Abbruchkriterien vorhanden sind
      - Das Szenario zum sicheren Abbruch realistisch und in einer Testumgebung überprüfbar ist
      - Keine Phasen ohne definierten Failure Plan

  integration_contract:
    name: "Integrationsvertrag"
    description: "Spezifikation der Integration mit einem externen/internen Service: Verträge, Fehler, Zuverlässigkeit."
    required_sections:
      - "Integrationszweck"
      - "Anfrage/Antwort-Verträge oder Ereignisse"
      - "Fehler, Retries und Timeouts"
      - "Idempotenz und Konsistenz"
      - "Beobachtbarkeit und SLA/SLO"
      - "Integrationstestplan"
    required_inputs:
      - "Womit integriert wird (Service, API, Warteschlange)"
      - "Integrationsrichtung (wir rufen auf / wir werden aufgerufen / bidirektional)"
      - "Zuverlässigkeitsanforderungen und zulässige Latenz"
    system_prompt_addition: |
      Analytische Methode — Contract-First Design:
      - Definiere den Vertrag VOR der Implementierung: Schema → Beispiele → Fehler → Edge Cases.
      - Definiere für jeden Endpoint/jedes Ereignis: Happy Path, Timeout, Partial Failure, Retry Semantics.
      - Verwende den Consumer-Driven Contract Ansatz: Beginne mit dem, was der Konsument braucht, nicht was dem Anbieter bequem ist.
      - Definiere explizit Circuit-Breaker-Parameter: Threshold, Timeout, Half-Open-Policy.

      Schwerpunkt: explizite Verträge und vorhersehbares Verhalten bei Ausfällen.
    qa_prompt: |
      Prüfe, dass:
      - Der Vertrag negative Szenarien enthält (Timeout, Partial Failure, 4xx/5xx)
      - Die Retry/Backoff-Politik explizit definiert ist (max Retries, Backoff-Strategie, Jitter)
      - Idempotenz für mutierende Operationen beschrieben ist
      - Circuit-Breaker-Parameter definiert sind

  security_review:
    name: "Sicherheitsanalyse"
    description: "Bewertung von Bedrohungen, Schwachstellen und Schutzmaßnahmen mit risikobasierter Priorisierung."
    required_sections:
      - "Angriffsfläche"
      - "Bedrohungsmodell"
      - "Schwachstellen und Risikoniveau"
      - "Remediation-Plan"
      - "Härtung und Kontrollprüfungen"
    required_inputs:
      - "Was analysiert wird (System, Komponente, API, Infrastruktur)"
      - "Angreifermodell (extern, Insider, automatisierter Angriff)"
      - "Datenkritikalität (PII, Finanzen, vertraulich)"
    system_prompt_addition: |
      Analytische Methode — STRIDE + DREAD scoring:
      - Wende für jede Systemkomponente STRIDE an: Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege.
      - Bewerte jede gefundene Bedrohung nach DREAD: Damage (1-10), Reproducibility (1-10), Exploitability (1-10), Affected Users (1-10), Discoverability (1-10).
      - Risk Score = DREAD-Durchschnitt. Priorisiere Remediation nach Risk Score.
      - Für jede Schwachstelle mit Risk Score > 5 MUST ein konkreter Remediation-Plan vorhanden sein.

      Schwerpunkt: risikobasierter Ansatz und praktische Remediation-Maßnahmen.
    qa_prompt: |
      Prüfe, dass:
      - STRIDE-Abdeckung für Schlüsselkomponenten vollständig ist
      - Jede Schwachstelle eine DREAD-Bewertung oder ähnliche Priorisierung hat
      - Schwachstellen mit hohem Risiko einen konkreten Remediation-Plan haben
      - Der Remediation-Plan enthält: was, wo, wer, Abschlusskriterium

  performance_analysis:
    name: "Leistungsanalyse"
    description: "Diagnose von Engpässen und Optimierungsplan mit messbarem Effekt."
    required_sections:
      - "Aktueller Zustand und Metriken (Baseline)"
      - "Engpass-Hypothesen"
      - "Mess-/Profilierungsplan"
      - "Vorgeschlagene Optimierungen"
      - "Erwarteter Effekt"
      - "Ergebnisvalidierungsplan"
    required_inputs:
      - "Welche Operationen/Szenarien langsam sind (konkrete Endpoints, Seiten, Prozesse)"
      - "Aktuelle Metriken (Latenz, Durchsatz, Ressourcennutzung) — falls verfügbar"
      - "Zielmetriken (welche Latenz/welcher Durchsatz akzeptabel ist)"
    system_prompt_addition: |
      Analytische Methode — USE Method (Utilization, Saturation, Errors) + RED Method (Rate, Errors, Duration):
      - Bestimme für jede Ressource (CPU, Memory, Disk, Network, DB-Verbindungen, Queues): Utilization, Saturation, Errors.
      - Bestimme für jeden Service: Rate (rps), Errors (error rate), Duration (latency p50/p95/p99).
      - Hypothesen MUST falsifizierbar sein: Gib für jede an, welches Experiment/welche Metrik zu prüfen ist.
      - Gib für jede Optimierung an: erwartete Verbesserung (quantitativ), Implementierungskosten, Risiken.

      Schwerpunkt: Metriken, Baseline und Effektprognose für jede Optimierung.
    qa_prompt: |
      Prüfe, dass:
      - Baseline festgehalten ist (aktuelle Metriken)
      - Jede Hypothese falsifizierbar ist (Prüfmethode angegeben)
      - Der erwartete Optimierungseffekt quantitativ ist und nicht nur „wird schneller"
      - Die vorgeschlagenen Maßnahmen dem erwarteten Gewinn angemessen sind (keine Mikrooptimierungen bei vorhandenen architektonischen Engpässen)

  test_strategy:
    name: "Teststrategie"
    description: "Testplan für Funktionalität/System: Ebenen, Prioritäten, Bereitschaftskriterien."
    required_sections:
      - "Testbereich"
      - "Risikobasierte Matrix"
      - "Unit/Integration/E2E-Strategie"
      - "Testdaten und Umgebungen"
      - "Release-Readiness-Kriterien"
    required_inputs:
      - "Was getestet wird (neue Funktionalität, Regression, Migration)"
      - "Testbudget (Zeit, Ressourcen, Umgebungen)"
      - "Kritische Benutzerszenarien"
    system_prompt_addition: |
      Analytische Methode — Risk-Based Testing + Test Pyramid:
      - Erstelle eine Risikomatrix: Funktionalität × Defektwahrscheinlichkeit × Defektauswirkung.
      - Verteile das Testbudget nach der Test Pyramid: Unit (70%) → Integration (20%) → E2E (10%) — an Kontext anpassen.
      - Definiere für Top-Risk-Bereiche: welche Tests MUST vorhanden sein, auf welcher Pyramidenebene.
      - Definiere: was NICHT getestet wird und warum (explizite Entscheidung, kein Auslassen).

      Schwerpunkt: Risikoreduzierung maximieren bei begrenztem Testbudget.
    qa_prompt: |
      Prüfe, dass:
      - Die Risikomatrix kritische Benutzer- und Betriebsszenarien abdeckt
      - Die Verteilung nach Pyramidenebenen begründet ist
      - Explizit angegeben ist, was NICHT getestet wird und warum
      - Release-Readiness-Kriterien messbar sind (nicht „alles funktioniert", sondern konkrete Metriken)

  release_readiness:
    name: "Release-Bereitschaftsbewertung"
    description: "Go/No-Go-Analyse vor dem Release mit Risikoprüfliste und Nachrelease-Kontrolle."
    required_sections:
      - "Release-Bereich"
      - "Bereitschaftsprüfliste"
      - "Bekannte Risiken und Toleranzen"
      - "Monitoring-Plan nach Release"
      - "Stopp-/Abbruchkriterien"
    required_inputs:
      - "Was im Release enthalten ist (Features, Fixes, Migrationen)"
      - "Testergebnisse (was bestanden wurde, was nicht)"
      - "Bekannte Probleme und akzeptierte Toleranzen"
    system_prompt_addition: |
      Analytische Methode — Evidence-Based Go/No-Go mit Weighted Scoring:
      - Definiere Go/No-Go-Kriterien und das Gewicht jedes Kriteriums (1-5): Tests, Abdeckung, Performance-Baseline, Sicherheitsprüfungen, Bereitschaft zum sicheren Abbruch, Dokumentation.
      - Bewerte für jedes Kriterium den Status: Pass / Pass with caveats / Fail.
      - Gesamtentscheidung = Weighted Sum. Jeder Fail bei einem Kriterium mit Gewicht ≥4 = automatisches No-Go.
      - „Pass with caveats" MUST enthalten: was genau toleriert wird, welches Risiko, wer genehmigt hat.

      Schwerpunkt: objektives Go/No-Go, keine optimistische Bewertung.
    qa_prompt: |
      Prüfe, dass:
      - Go/No-Go-Kriterien eindeutig und gewichtet sind
      - Jedes „Pass with caveats" eine Beschreibung der Toleranz und des Risikos enthält
      - Stopp-/Abbruchkriterien eindeutig sind (nicht „wenn etwas schiefgeht")
      - Der Monitoring-Plan konkrete Metriken und Schwellenwerte enthält

  technical_debt:
    name: "Technische-Schulden-Audit"
    description: "Inventarisierung und Priorisierung technischer Schulden mit Kosten- und Effektbewertung."
    required_sections:
      - "Kategorien technischer Schulden"
      - "Auswirkungen auf Produkt/Entwicklungsgeschwindigkeit"
      - "Priorisierung (Impact/Aufwand/Risiko)"
      - "Tilgungs-Roadmap"
      - "Fortschrittskontrollkriterien"
    required_inputs:
      - "Welche Projektbereiche die größten Probleme verursachen"
      - "Kontext: warum es jetzt wichtig ist, technische Schulden anzugehen"
      - "Budget für die Tilgung (% der Sprint-Kapazität oder konkrete Fristen)"
    system_prompt_addition: |
      Analytische Methode — Tech Debt Quadrant (Fowler) + SQALE-lite:
      - Klassifiziere jedes Schuldelement nach dem Fowler-Quadranten: Deliberate/Inadvertent × Reckless/Prudent.
      - Bewerte für jedes Element: Impact auf die Entwicklungsgeschwindigkeit (1-5), Aufwand für die Beseitigung (S/M/L/XL), Risiko bei Nichtbeseitigung (1-5).
      - Priority Score = Impact × Risk / Effort_normalized. Sortiere die Roadmap nach Priority Score.
      - Die Roadmap MUST Quick Wins (hoher Impact, geringer Aufwand) im ersten Sprint/in der ersten Phase enthalten.

      Schwerpunkt: praktischer Rückstand technischer Schulden mit realistischer Roadmap.
    qa_prompt: |
      Prüfe, dass:
      - Die Priorisierung transparent ist und auf Impact/Aufwand/Risiko basiert
      - Quick Wins identifiziert und als erste in der Roadmap platziert sind
      - Die Roadmap realistisch in Bezug auf das angegebene Budget ist
      - Fortschrittskriterien messbar sind (nicht „es wurde besser", sondern konkrete Metriken)
