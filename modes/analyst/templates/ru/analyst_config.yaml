# flake8: noqa
templates:
  default:
    name: "Базовый анализ по запросу"
    description: "Универсальный облегченный шаблон: проанализировать задачу пользователя и дать структурированный результат."
    required_sections:
      - "Понимание запроса"
      - "Ключевые наблюдения"
      - "Варианты решения"
      - "Рекомендованный вариант"
      - "Риски и ограничения"
      - "Следующие шаги"
    required_inputs:
      - "Описание задачи или вопроса"
      - "Контекст: какое решение нужно принять на основе анализа"
    system_prompt_addition: |
      Подготовь краткий, но прикладной анализ строго по запросу пользователя.
      Не пытайся превращать результат в полное ТЗ, если это не требуется явно.
      Делай акцент на конкретных действиях и критериях проверки.

      Аналитический метод:
      - Для каждого варианта решения используй структуру: «Вариант → Плюсы → Минусы → Условия применимости».
      - Рекомендованный вариант MUST содержать обоснование выбора: почему именно он, а не другие.
    qa_prompt: |
      Проверь, что вывод:
      - напрямую отвечает на запрос пользователя;
      - содержит конкретные рекомендации с обоснованием;
      - не перегружен избыточной детализацией;
      - фиксирует ключевые риски и next steps;
      - рекомендованный вариант обоснован, а не просто назван.

  # Target audience для spec-oriented templates = low-middle developer:
  # итоговый документ должен быть реализуем без устных пояснений и не рассчитывать на senior-only контекст.
  new_spec:
    name: "ТЗ на разработку с нуля"
    description: "Полный шаблон технического задания (ТЗ) для новой разработки: требования, архитектура, приемка."
    required_sections:
      - "Контекст и обзор"
      - "Цели и измеримые критерии успеха"
      - "Область работ (In/Out)"
      - "Предположения и ограничения"
      - "Стейкхолдеры, роли и права доступа"
      - "Пользовательские сценарии"
      - "Функциональные требования"
      - "Нефункциональные требования"
      - "Интеграции и внешние зависимости"
      - "Данные и модель домена"
      - "Архитектурные решения и ограничения"
      - "API и контракты"
      - "Наблюдаемость и эксплуатация"
      - "Политики данных и приватность"
      - "План реализации по этапам"
      - "План тестирования и критерии приемки"
      - "Риски и открытые вопросы"
    required_inputs:
      - "Бизнес-цель или проблема, которую решает продукт"
      - "Целевая аудитория и ключевые пользователи"
      - "Известные ограничения (бюджет, сроки, технологический стек)"
      - "Приоритеты: что критично для MVP, а что можно отложить"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "large"
    traceability_rules:
      - "Каждый UC-xxx MUST быть покрыт минимум одним FR-xxx"
      - "Каждый FR-xxx с приоритетом Must MUST иметь критерий приёмки и тест в матрице трассируемости"
      - "Каждый API-xxx MUST быть привязан к FR-xxx, который его требует"
      - "Каждый NFR-xxx MUST иметь измеримый SLO и способ проверки"
      - "Если UC-xxx не покрыт ни одним FR — это пропуск, который MUST быть устранён"
    system_prompt_addition: |
      Ты аналитик. Твоя задача — подготовить точный, практичный документ, пригодный для выполнения.
      Избегай общих фраз и сохраняй проверяемость утверждений.

      Аналитический метод — MECE-декомпозиция:
      - Разложи scope на взаимоисключающие области (Mutually Exclusive), совместно покрывающие всё (Collectively Exhaustive).
      - Для каждой области выведи пользовательские сценарии, затем из UC — функциональные требования.
      - Проверь покрытие: если область scope не имеет ни одного UC — либо добавь UC, либо явно вынеси в Out.

      Обязательные правила оформления:
      - Пиши так, чтобы по документу можно было: оценить объем работ, спланировать реализацию, реализовать без "догадок", протестировать и принять.
      - Везде, где возможно, используй измеримые величины (таймауты, перцентили, RPS/конкурентность, лимиты, сроки хранения, коды ошибок).
      - Используй идентификаторы и трассируемость: `UC-xxx` (сценарии), `FR-xxx` (функциональные), `NFR-xxx` (нефункциональные), `API-xxx` (контракты).

      Правила трассируемости (ОБЯЗАТЕЛЬНО):
      - Каждый UC-xxx MUST быть покрыт минимум одним FR-xxx.
      - Каждый FR-xxx с приоритетом Must MUST иметь критерий приёмки и строку в матрице трассируемости.
      - Каждый API-xxx MUST быть привязан к FR-xxx, который его требует.
      - В конце документа — матрица трассируемости: `UC | FR | API | NFR | Тест/приемка`. Все Must-FR покрыты.

      Формат разделов:
      - "Область работ (In/Out)" оформляй таблицей: `Фича/область | In/Out | MVP/Next | Почему | Зависимости/ограничения`.
      - "Пользовательские сценарии": для каждого `UC-xxx` укажи: `Акторы`, `Предусловия`, `Шаги`, `Ожидаемый результат`, `Ошибки/исключения` (минимум 1 негативный сценарий для критических потоков).
      - "Функциональные требования": оформляй как список требований `FR-xxx` и группируй по приоритету `Must/Should/Could`. Для каждого `FR-xxx` укажи:
        `Описание` (1-2 предложения), `Критерий приемки` (pass/fail), `Проверка/тест` (как проверить), `Ошибки/валидация` (какие ошибки и при каких условиях).
      - "Нефункциональные требования": используй `NFR-xxx` и таблицу SLI/SLO:
        `Метрика (SLI) | Цель (SLO) | Окно измерения | 95p/99p (если применимо) | Где измеряем | Примечания`.
        Укажи, что считается "нормальной" и "пиковой" нагрузкой (в терминах системы), и какие деградации допустимы/недопустимы.
      - "API и контракты": опиши ключевые интерфейсы в формате контрактов `API-xxx`. Для каждого контракта укажи минимум:
        `Назначение`, `Аутентификация/авторизация`, `Входные данные` (схема + пример), `Выходные данные` (схема + пример),
        `Ошибки` (коды/типы ошибок и условия), `Идемпотентность/конкурентность` (если применимо), `Лимиты/квоты` (если применимо).
        Если в системе есть события/сообщения (асинхронные интерфейсы), опиши для них аналогичные контракты: `тип`, `payload`, `ack/ошибки`, `порядок/повторы` (если важно).
    qa_prompt: |
      Проверка трассируемости (БЛОКИРУЮЩАЯ):
      - Каждый UC-xxx покрыт минимум одним FR-xxx? Если нет — ДОРАБОТАЙ.
      - Каждый Must FR-xxx имеет критерий приёмки (pass/fail)? Если нет — ДОРАБОТАЙ.
      - Каждый API-xxx привязан к FR-xxx? Если нет — ДОРАБОТАЙ.
      - Матрица трассируемости присутствует и все Must-FR покрыты? Если нет — ДОРАБОТАЙ.

      Проверка полноты:
      - Каждый раздел присутствует и не пустой
      - "Область работ (In/Out)" содержит явные списки In и Out (без двусмысленности)
      - "Стейкхолдеры, роли и права доступа" описывает роли, разрешения и ключевые потоки
      - "Пользовательские сценарии" покрывают ключевые пути (happy path и 1-2 негативных сценария на критические функции)
      - "Функциональные требования" приоритезированы (Must/Should/Could) и содержат критерии проверки
      - "Нефункциональные требования" включают измеримые SLO/SLI
      - "Данные и модель домена" содержит сущности, поля и связи
      - "API и контракты" содержат примеры payload и коды ошибок
      - "Наблюдаемость и эксплуатация" содержит метрики/логи/трейсы, алерты
      - "План тестирования и критерии приемки" содержит четкие pass/fail критерии для Must-требований
      Если что-то расплывчато, перепиши конкретно.

  audit:
    name: "Отчет по аудиту"
    description: "Критический аудит существующего документа/кодовой базы с рисками и рекомендациями."
    required_sections:
      - "Общая оценка"
      - "Наблюдения"
      - "Риски"
      - "Рекомендации"
      - "Следующие шаги"
    required_inputs:
      - "Что именно аудируется (файл, модуль, проект, документ)"
      - "Фокус аудита (безопасность, архитектура, качество кода, соответствие требованиям)"
    system_prompt_addition: |
      Ты аудитор. Будь критичен, опирайся на доказательства и выделяй самые важные проблемы.

      Аналитический метод — Evidence-Based Audit:
      - Для каждого наблюдения используй структуру: «Факт (что обнаружено, где) → Влияние (что это значит) → Рекомендация (что делать)».
      - Классифицируй каждое наблюдение по severity: Critical / Major / Minor / Info.
      - Critical и Major MUST содержать конкретные ссылки на файлы/функции/строки.
      - Отделяй подтверждённые факты от гипотез — помечай гипотезы как [Требует проверки].
    qa_prompt: |
      Проверь, что отчет по аудиту:
      - Каждое наблюдение содержит: факт + источник + severity + рекомендацию
      - Critical/Major наблюдения ссылаются на конкретные файлы/функции
      - Факты отделены от предположений (гипотезы помечены)
      - Рекомендации приоритезированы и actionable (что, где, зачем)
      Перепиши расплывчатые формулировки в виде конкретных наблюдений.

  change_spec:
    name: "ТЗ на доработку"
    description: "Шаблон для изменений существующего продукта/проекта с repo-grounded scope, влиянием и проверкой."
    required_sections:
      - "Контекст текущей системы"
      - "Подтвержденные факты и источники"
      - "Цели изменения и критерии успеха"
      - "Подтвержденные изменения по компонентам"
      - "Влияние на код, данные, API и UX"
      - "Implementation handoff по компонентам и файлам"
      - "Совместимость и ограничения внедрения"
      - "Риски и открытые проверки"
      - "План тестирования и приемки"
    required_inputs:
      - "Что именно нужно доработать и зачем (бизнес-причина)"
      - "Какие компоненты/модули затронуты или предположительно затронуты"
      - "Требования к обратной совместимости"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: false
    target_size_hint: "medium"
    traceability_rules:
      - "Каждое изменение MUST быть привязано к компоненту и содержать: что меняем, как тестируем, какие ограничения по совместимости учитываем"
      - "Impact analysis MUST покрывать все компоненты из списка изменений"
      - "Каждый затронутый API MUST иметь описание изменений контракта (before/after)"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    system_prompt_addition: |
      Аналитический метод — Impact-Driven Change Analysis:
      - Для каждого изменения примени структуру: «Компонент/подсистема → Подтвержденное текущее поведение → Целевое поведение → Что именно меняем → Как проверяем».
      - Проверяй каскадные эффекты: если меняется A, что зависит от A? Что зависит от зависимостей A?
      - Фиксируй blast radius только по подтвержденным затронутым зонам. Не добавляй поверхности, интеграции, миграции или деплой-шаги, если они не подтверждены кодом проекта или прямым запросом пользователя.
      - Не перечисляй все поверхности проекта. Описывай только компоненты, файлы и пользовательские сценарии, которые прямо нужны для данной доработки.
      - Если изменение локальное, не раздувай документ в общий enterprise-change-plan.

      Фокус: минимально инвазивные изменения, обратная совместимость и проверяемые критерии приемки.
      Используй реальный репозиторий как source of truth и делай документ пригодным для low-middle разработчика без устных пояснений.
    qa_prompt: |
      Проверка трассируемости (БЛОКИРУЮЩАЯ):
      - Для каждого изменения указаны: где меняем, подтвержденное текущее/целевое поведение, как тестируем? Если нет — ДОРАБОТАЙ.
      - Impact analysis покрывает все компоненты из списка изменений? Если нет — ДОРАБОТАЙ.
      Проверка полноты:
      - Документ repo-grounded и не противоречит коду
      - Достаточен для low-middle разработчика без устных пояснений
      - Каскадные эффекты изменений проанализированы
      - Нет выдуманных поверхностей, интеграций, route/controller/table/test-file путей без repo evidence
      - Нет разделов про незатронутые поверхности проекта, если они не подтверждены запросом или кодом
      - Миграции и деплой упомянуты только если реально требуются по подтвержденным изменениям

  ui_change_spec:
    name: "ТЗ на локальную UI/UX-доработку"
    description: "Узкий repo-grounded шаблон для локальных изменений интерфейса, компонента или пользовательского сценария."
    required_sections:
      - "Контекст и подтвержденные факты"
      - "Подтвержденные факты и источники"
      - "Целевое поведение и UX-критерии"
      - "Изменения по компонентам и состояниям"
      - "Затронутые файлы, зависимости и ограничения"
      - "Implementation handoff по компонентам и файлам"
      - "План реализации, проверки и приемки"
      - "Открытые вопросы и риски"
    required_inputs:
      - "Что именно нужно изменить в UI/UX и зачем"
      - "Какой компонент, экран или пользовательский сценарий затронут"
      - "Что критично не сломать в текущем поведении"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Каждое изменение MUST быть привязано к конкретному компоненту/состоянию и подтвержденному файлу или артефакту"
      - "Каждый критерий приемки MUST проверять конкретное видимое поведение интерфейса"
      - "Если затронута обратная совместимость UX-сценария, это MUST быть явно описано"
    system_prompt_addition: |
      Ты готовишь узкое рабочее ТЗ на локальную UI/UX-доработку существующего проекта.

      Аналитический метод:
      - Для каждого изменения используй структуру: «Компонент/состояние → Подтвержденное текущее поведение → Целевое поведение → Что меняем в разметке/логике/стилях → Как проверяем».
      - Фокусируйся на локальном scope: компонент, экран, форма, dropdown, header, menu, CTA, states, responsive behavior.
      - Не раздувай документ в общий change-plan по данным, API, миграциям, rollout или инфраструктуре, если это не подтверждено кодом проекта.
      - Если backend/API/данные реально затронуты, опиши только подтвержденную зону влияния и явно отдели ее от UI-части.
      - Затронутые поверхности перечисляй только если они прямо подтверждены репозиторием и действительно меняются.
    qa_prompt: |
      Проверка полноты (БЛОКИРУЮЩАЯ):
      - Для каждого изменения указаны: где меняем, подтвержденное текущее поведение, целевое поведение, критерий приемки.
      - Все рекомендации repo-grounded и привязаны к конкретным файлам/компонентам/состояниям.
      - Нет выдуманных route/controller/table/API/test-file путей без repo evidence.
      - Документ не раздут лишними разделами про миграции, rollout, инфраструктуру или внешние поверхности, если они не подтверждены.
      - Открытые вопросы вынесены отдельно и не замаскированы под готовые решения.

  bugfix_spec:
    name: "ТЗ на исправление бага"
    description: "Узкий repo-grounded шаблон для исправления конкретного бага или регрессии в существующей системе."
    required_sections:
      - "Контекст бага и подтвержденные симптомы"
      - "Подтвержденные факты и источники"
      - "Подтвержденное текущее поведение и зона поломки"
      - "Целевое поведение и критерии исправления"
      - "План исправления и затронутые файлы"
      - "Implementation handoff по компонентам и файлам"
      - "Риски регрессии и проверки"
      - "Открытые вопросы"
    required_inputs:
      - "Какой баг или регрессия наблюдается"
      - "Какой сценарий должен работать после исправления"
      - "Что нельзя сломать рядом с этим багом"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Каждое исправление MUST быть привязано к подтвержденному симптому и конкретной зоне кода"
      - "Каждый критерий приемки MUST доказывать устранение бага и отсутствие ключевой регрессии"
    system_prompt_addition: |
      Фокусируйся на одном баге или тесно связанной группе симптомов.
      Используй структуру: «Симптом → Подтвержденная зона поломки → Что исправляем → Как проверяем фиксацию».
      Не раздувай документ в общий refactor/change-plan.
      Если root cause не подтвержден, отделяй его от symptom-level фактов.
    qa_prompt: |
      Проверка полноты:
      - Симптомы и подтвержденная зона поломки описаны отдельно.
      - План исправления привязан к конкретным файлам/компонентам.
      - Есть критерии проверки фикса и минимальный anti-regression набор.
      - Нет выдуманных root cause, API, таблиц или route без repo evidence.

  integration_change_spec:
    name: "ТЗ на изменение интеграции"
    description: "Узкий repo-grounded шаблон для изменений внешней интеграции, API-контракта, webhook или провайдера."
    required_sections:
      - "Контекст интеграции и подтвержденные точки входа"
      - "Подтвержденные факты и источники"
      - "Текущее и целевое поведение интеграции"
      - "Изменения контрактов, payload и обработки ошибок"
      - "Затронутые компоненты и ограничения совместимости"
      - "Implementation handoff по компонентам и файлам"
      - "План проверки интеграции"
      - "Открытые риски и зависимости"
    required_inputs:
      - "Какая интеграция или внешний контракт меняется"
      - "Что именно должно измениться в обмене данными или поведении"
      - "Какие ограничения совместимости обязательны"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Каждое изменение MUST быть привязано к конкретной интеграционной точке или контракту"
      - "Для каждого контракта MUST быть описано текущее и целевое поведение, включая ошибки"
    system_prompt_addition: |
      Фокус на подтвержденных интеграционных точках: API client, webhook handler, provider adapter, payload schema, retry/error handling.
      Не расширяй документ до общего product change-plan, если меняется только интеграционный слой.
      Если внешняя часть не подтверждена кодом проекта, явно помечай это как [Требует проверки].
    qa_prompt: |
      Проверка полноты:
      - Изменения привязаны к конкретным интеграционным точкам.
      - Описаны входные/выходные payload, ошибки и совместимость.
      - Нет выдуманных endpoint/provider/table без repo evidence.
      - План проверки покрывает happy path и отказоустойчивость.

  narrow_backend_change_spec:
    name: "ТЗ на узкую backend-доработку"
    description: "Узкий repo-grounded шаблон для локальных server-side изменений без широкого product scope."
    required_sections:
      - "Контекст backend-зоны и подтвержденные факты"
      - "Подтвержденные факты и источники"
      - "Текущее и целевое поведение логики"
      - "Изменения по сервисам, handlers, данным и контрактам"
      - "Implementation handoff по компонентам и файлам"
      - "Совместимость, ограничения и side-effects"
      - "План реализации и проверки"
      - "Открытые вопросы и риски"
    required_inputs:
      - "Какую server-side логику нужно изменить"
      - "Какой компонент/сервис/handler затронут"
      - "Какие сценарии нельзя сломать"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Каждое изменение MUST быть привязано к подтвержденному backend-компоненту и текущему поведению"
      - "План проверки MUST покрывать ключевые side-effects и совместимость"
    system_prompt_addition: |
      Фокус на локальной backend-логике: service, handler, controller, доменная модель, validation, internal contract.
      Не раздувай документ до refactor-wide или project-wide плана, если изменение локальное.
      Если затрагиваются данные/API, описывай только подтвержденную область влияния.
    qa_prompt: |
      Проверка полноты:
      - Текущее и целевое поведение backend-логики описано и привязано к коду.
      - Side-effects и совместимость перечислены явно.
      - Нет выдуманных таблиц, endpoint, событий или классов без repo evidence.
      - План проверки покрывает основной сценарий и регрессионные зоны.

  project_analysis:
    name: "Анализ проекта"
    description: "Структурный анализ существующего проекта: архитектура, проблемы, рекомендации, next steps."
    required_sections:
      - "Краткое резюме"
      - "Архитектурная картина"
      - "Технические риски и узкие места"
      - "Качество кода и тестового покрытия"
      - "Приоритетные рекомендации"
      - "План действий на 30/60/90 дней"
    required_inputs:
      - "Цель анализа (принятие решения о рефакторинге, аудит перед релизом, онбординг, и т.д.)"
      - "Какие аспекты проекта наиболее важны (архитектура, качество, производительность, безопасность)"
    system_prompt_addition: |
      Аналитический метод — ATAM-lite (Architecture Tradeoff Analysis):
      - Выяви ключевые архитектурные драйверы (качества системы, которые важны стейкхолдерам).
      - Для каждого архитектурного решения определи: какие качества оно поддерживает, какие ограничивает (tradeoff).
      - Риски = точки, где архитектурные решения НЕ поддерживают заявленные качества.
      - Рекомендации MUST быть привязаны к конкретным рискам, а не быть общими пожеланиями.

      Фокус: конкретные наблюдения и доказательства из репозитория. Избегай общих фраз.
    qa_prompt: |
      Проверь, что:
      - Каждый риск подтверждён наблюдением из кода/конфигов (с указанием файла/функции)
      - Рекомендации приоритезированы по impact/effort
      - План 30/60/90 реалистичен и привязан к конкретным рискам
      - Нет «общих рекомендаций» без привязки к наблюдению

  bug_investigation:
    name: "Спецификация расследования бага"
    description: "Шаблон для анализа дефекта: воспроизведение, гипотезы, RCA, план исправления и валидации."
    required_sections:
      - "Симптомы и контекст"
      - "Шаги воспроизведения"
      - "Гипотезы причин"
      - "Root cause"
      - "План исправления"
      - "Проверка и регрессии"
    required_inputs:
      - "Описание наблюдаемого поведения (что происходит)"
      - "Описание ожидаемого поведения (что должно происходить)"
      - "Условия воспроизведения (окружение, данные, последовательность действий)"
    system_prompt_addition: |
      Аналитический метод — 5 Whys + Fault Tree:
      - Для каждого симптома задай «почему?» минимум 5 раз, пока не дойдёшь до корневой причины.
      - Построй дерево причин (Fault Tree): корень = наблюдаемый симптом, листья = возможные первопричины.
      - Для каждой гипотезы укажи: как подтвердить (что проверить в коде/логах/данных) и как опровергнуть.
      - Root cause MUST быть подтверждён конкретным доказательством, а не просто «наиболее вероятная гипотеза».

      Фокус: причинно-следственные связи, а не перечисление симптомов.
    qa_prompt: |
      Проверь, что:
      - Root cause подтверждён конкретным доказательством (файл, строка, лог, состояние)
      - Цепочка «симптом → ... → root cause» логична и не имеет пропущенных звеньев
      - План исправления устраняет root cause, а не симптомы
      - Регрессионные сценарии покрывают изменённое поведение

  incident_rca:
    name: "RCA инцидента"
    description: "Пост-инцидентный разбор: timeline, первопричина, corrective/preventive actions."
    required_sections:
      - "Описание инцидента"
      - "Timeline"
      - "Влияние и затронутые зоны"
      - "Первопричина"
      - "Corrective actions"
      - "Preventive actions"
      - "Метрики контроля после исправлений"
    required_inputs:
      - "Когда инцидент произошёл и когда был обнаружен"
      - "Описание влияния на пользователей/систему"
      - "Доступные логи, метрики, алерты по инциденту"
    system_prompt_addition: |
      Аналитический метод — Ishikawa (Fishbone) + Swiss Cheese Model:
      - Построй диаграмму Ishikawa: классифицируй причины по категориям (People, Process, Technology, Environment).
      - Примени Swiss Cheese Model: определи, какие защитные слои (мониторинг, тесты, ревью, алерты) были пробиты и почему.
      - Timeline MUST содержать: время события, кто обнаружил, какое действие предпринято, результат действия.
      - Preventive actions MUST закрывать конкретные «дыры» в защитных слоях, а не быть общими рекомендациями.

      Фокус: верифицируемые факты, без поиска виноватых.
    qa_prompt: |
      Проверь, что:
      - Timeline полный: от первого симптома до полного восстановления
      - Первопричина подтверждена фактами, а не назначена
      - Каждый preventive action закрывает конкретную «дыру» в защитном слое
      - Preventive actions имеют владельца и срок (или помечены [Нужно назначить])

  impact_analysis:
    name: "Анализ влияния изменений"
    description: "Оценка влияния планируемого изменения на систему, данные, API, эксплуатацию и тесты."
    required_sections:
      - "Описание изменения"
      - "Затронутые подсистемы"
      - "Влияние на API/контракты"
      - "Влияние на данные и миграции"
      - "Влияние на инфраструктуру/наблюдаемость"
      - "Риски и меры снижения"
      - "План проверки"
    required_inputs:
      - "Описание планируемого изменения"
      - "Какие компоненты/модули напрямую затронуты"
      - "Есть ли требования к обратной совместимости или downtime"
    system_prompt_addition: |
      Аналитический метод — FMEA-lite (Failure Mode and Effects Analysis):
      - Для каждой затронутой подсистемы определи возможные failure modes (как может сломаться).
      - Для каждого failure mode оцени: Severity (1-5), Likelihood (1-5), Detectability (1-5).
      - Risk Priority = Severity × Likelihood × Detectability. Фокусируйся на top-5 по Risk Priority.
      - Для каждого риска из top-5 MUST быть конкретная мера снижения.

      Фокус: трассируемое покрытие всех зон влияния. Проверяй каскадные зависимости.
    qa_prompt: |
      Проверь, что:
      - Нет "слепых зон" (данные, права, мониторинг, действия при сбое)
      - Каскадные зависимости проанализированы (не только прямые)
      - Для каждого risk из top-5 есть мера снижения
      - План проверки покрывает все затронутые подсистемы

  refactor_spec:
    name: "ТЗ на рефакторинг"
    description: "План рефакторинга без изменения поведения: границы, этапы, контроль регрессий."
    required_sections:
      - "Текущее состояние кодовой базы"
      - "Подтвержденные факты и источники"
      - "Целевое состояние"
      - "Ограничения и не-цели"
      - "Затронутые поверхности"
      - "Изменения по слоям/компонентам"
      - "Изменения persistence/state/config"
      - "Миграция и совместимость"
      - "Startup/restore/reconcile логика"
      - "Отказ от legacy и что именно удаляется"
      - "План реализации по этапам"
      - "Implementation handoff по компонентам и файлам"
      - "Контроль поведенческой эквивалентности"
      - "План тестирования и критерии приемки"
      - "Риски и открытые вопросы"
    required_inputs:
      - "Что именно рефакторится и почему (техдолг, производительность, расширяемость)"
      - "Явные границы: что НЕ входит в scope рефакторинга"
      - "Критерии поведенческой эквивалентности (как доказать, что поведение не изменилось)"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "large"
    traceability_rules:
      - "Каждое изменение по слою/компоненту MUST иметь способ проверки поведенческой эквивалентности"
      - "Каждый этап плана MUST содержать: затронутые компоненты, риски, критерий остановки"
      - "Каждая удалённая сущность MUST быть проверена на отсутствие зависимостей"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    system_prompt_addition: |
      Ты готовишь рабочее ТЗ на рефакторинг существующего проекта.

      Аналитический метод — Strangler Fig Pattern + Characterization Tests:
      - Для каждого компонента определи: текущее поведение (characterization) → целевая структура → путь перехода.
      - Рефакторинг MUST быть инкрементальным: каждый этап оставляет систему в рабочем состоянии.
      - Для каждого этапа определи characterization tests: тесты, которые фиксируют текущее поведение и MUST проходить после изменений.

      Обязательные правила:
      - source of truth = реальные файлы проекта, а не только карта кодовой базы;
      - документ должен быть достаточен для low-middle разработчика без устных пояснений;
      - рефакторинг не должен расширять scope и не должен незаметно менять поведение;
      - для каждого этапа явно укажи затронутые компоненты, риски, способ проверки и критерий остановки;
      - отдельно фиксируй только подтвержденные затронутые поверхности и артефакты, которые реально надо перепроверить после рефакторинга;
      - если предлагается новый config key, fallback layer, compatibility wrapper, сущность или API, это должно быть явно обосновано кодом или запросом пользователя.
    qa_prompt: |
      Проверка трассируемости (БЛОКИРУЮЩАЯ):
      - Каждый этап имеет: затронутые компоненты, риски, способ проверки, критерий остановки? Если нет — ДОРАБОТАЙ.
      - Каждая удалённая сущность проверена на отсутствие зависимостей? Если нет — ДОРАБОТАЙ.
      Проверка полноты:
      - Остается template-first спецификацией, а не общим рассуждением
      - Содержит явные границы scope и не-цели
      - Перечислены только подтвержденные затронутые поверхности/артефакты, а не шаблонный список
      - Задаёт объективные критерии "поведение не изменилось"
      - Пригоден для low-middle разработчика без устных пояснений
      - Содержит критерии остановки/прерывания

  migration_plan:
    name: "План миграции"
    description: "Шаблон миграции технологий/схем/контрактов с этапностью и безопасным прерыванием."
    required_sections:
      - "Цели миграции"
      - "Текущее и целевое состояние"
      - "Стратегия перехода"
      - "План обратной совместимости"
      - "План безопасного прерывания"
      - "Критерии завершения"
    required_inputs:
      - "Что мигрируется (технология, схема данных, API, инфраструктура)"
      - "Причина миграции и ожидаемый результат"
      - "Допустимый downtime и окно миграции"
      - "Требования к обратной совместимости"
    system_prompt_addition: |
      Аналитический метод — Blue-Green / Canary Migration:
      - Определи стратегию перехода: Big Bang, Blue-Green, Canary, Strangler Fig — и обоснуй выбор.
      - Для каждого этапа определи: point of no return, критерии остановки/прерывания, метрики здоровья.
      - Plan for failure: для каждого этапа опиши, что делать если он провалился.
      - Сценарий безопасного прерывания MUST быть проверяем в тестовом контуре до начала продовой миграции.

      Фокус: минимизировать downtime и риск потери данных.
    qa_prompt: |
      Проверь, что:
      - Стратегия перехода обоснована (почему именно этот подход)
      - Для каждого этапа есть point of no return и критерии остановки/прерывания
      - Сценарий безопасного прерывания реалистичен и проверяем в тестовом контуре
      - Нет этапов без определённого failure plan

  integration_contract:
    name: "Контракт интеграции"
    description: "Спецификация интеграции с внешним/внутренним сервисом: контракты, ошибки, надежность."
    required_sections:
      - "Цель интеграции"
      - "Контракты запрос/ответ или события"
      - "Ошибки, ретраи и таймауты"
      - "Идемпотентность и консистентность"
      - "Наблюдаемость и SLA/SLO"
      - "План тестирования интеграции"
    required_inputs:
      - "С чем интегрируемся (сервис, API, очередь)"
      - "Направление интеграции (мы вызываем / нас вызывают / двустороннее)"
      - "Требования к надёжности и допустимая latency"
    system_prompt_addition: |
      Аналитический метод — Contract-First Design:
      - Определи контракт ДО реализации: schema → примеры → ошибки → edge cases.
      - Для каждого endpoint/события определи: happy path, timeout, partial failure, retry semantics.
      - Используй Consumer-Driven Contract подход: начни с того, что нужно потребителю, а не что удобно поставщику.
      - Явно определи Circuit Breaker параметры: threshold, timeout, half-open policy.

      Фокус: явные контракты и предсказуемое поведение при сбоях.
    qa_prompt: |
      Проверь, что:
      - Контракт включает негативные сценарии (timeout, partial failure, 4xx/5xx)
      - Retry/backoff политика определена явно (max retries, backoff strategy, jitter)
      - Идемпотентность описана для мутирующих операций
      - Circuit Breaker параметры определены

  security_review:
    name: "Анализ безопасности"
    description: "Оценка угроз, уязвимостей и мер защиты с приоритезацией по риску."
    required_sections:
      - "Поверхность атаки"
      - "Модель угроз"
      - "Уязвимости и уровень риска"
      - "План remediation"
      - "Hardening и контрольные проверки"
    required_inputs:
      - "Что анализируется (система, компонент, API, инфраструктура)"
      - "Модель злоумышленника (внешний, инсайдер, автоматизированная атака)"
      - "Критичность данных (PII, финансы, конфиденциальное)"
    system_prompt_addition: |
      Аналитический метод — STRIDE + DREAD scoring:
      - Для каждого компонента системы примени STRIDE: Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege.
      - Для каждой найденной угрозы оцени по DREAD: Damage (1-10), Reproducibility (1-10), Exploitability (1-10), Affected Users (1-10), Discoverability (1-10).
      - Risk Score = среднее DREAD. Приоритизируй remediation по Risk Score.
      - Для каждой уязвимости с Risk Score > 5 MUST быть конкретный remediation plan.

      Фокус: риск-ориентированный подход и практические remediation-меры.
    qa_prompt: |
      Проверь, что:
      - STRIDE покрытие полное для ключевых компонентов
      - У каждой уязвимости есть DREAD-оценка или аналогичная приоритизация
      - У уязвимостей с высоким риском есть конкретный remediation plan
      - Remediation plan содержит: что, где, кто, критерий закрытия

  performance_analysis:
    name: "Анализ производительности"
    description: "Диагностика bottleneck'ов и план оптимизаций с измеримым эффектом."
    required_sections:
      - "Текущее состояние и метрики (baseline)"
      - "Гипотезы узких мест"
      - "План измерений/профилирования"
      - "Предлагаемые оптимизации"
      - "Ожидаемый эффект"
      - "План валидации результатов"
    required_inputs:
      - "Какие операции/сценарии тормозят (конкретные endpoint, страницы, процессы)"
      - "Текущие метрики (latency, throughput, resource usage) — если доступны"
      - "Целевые метрики (какой latency/throughput приемлем)"
    system_prompt_addition: |
      Аналитический метод — USE Method (Utilization, Saturation, Errors) + RED Method (Rate, Errors, Duration):
      - Для каждого ресурса (CPU, memory, disk, network, DB connections, queues) определи: Utilization, Saturation, Errors.
      - Для каждого сервиса определи: Rate (rps), Errors (error rate), Duration (latency p50/p95/p99).
      - Гипотезы MUST быть фальсифицируемы: для каждой укажи, какой эксперимент/метрику проверить.
      - Для каждой оптимизации укажи: ожидаемое улучшение (количественно), стоимость реализации, риски.

      Фокус: метрики, baseline и прогноз эффекта для каждой оптимизации.
    qa_prompt: |
      Проверь, что:
      - Baseline зафиксирован (текущие метрики)
      - Каждая гипотеза фальсифицируема (указан способ проверки)
      - Ожидаемый эффект оптимизаций количественный, а не «станет быстрее»
      - Предложенные меры соразмерны ожидаемому выигрышу (нет микрооптимизаций при наличии архитектурных bottleneck'ов)

  test_strategy:
    name: "Стратегия тестирования"
    description: "План тестирования функционала/системы: уровни, приоритеты, критерии готовности."
    required_sections:
      - "Область тестирования"
      - "Риск-ориентированная матрица"
      - "Unit/Integration/E2E стратегия"
      - "Тестовые данные и окружения"
      - "Критерии release readiness"
    required_inputs:
      - "Что тестируется (новый функционал, регрессия, миграция)"
      - "Бюджет на тестирование (время, ресурсы, окружения)"
      - "Критические пользовательские сценарии"
    system_prompt_addition: |
      Аналитический метод — Risk-Based Testing + Test Pyramid:
      - Построй матрицу рисков: Функционал × Вероятность дефекта × Влияние дефекта.
      - Распредели тестовый бюджет по Test Pyramid: Unit (70%) → Integration (20%) → E2E (10%) — адаптируй под контекст.
      - Для top-risk зон определи: какие тесты MUST быть, на каком уровне пирамиды.
      - Определи: что НЕ тестируем и почему (явное решение, а не пропуск).

      Фокус: максимизировать снижение рисков при ограниченном бюджете тестирования.
    qa_prompt: |
      Проверь, что:
      - Риск-матрица покрывает критические пользовательские и эксплуатационные сценарии
      - Распределение по уровням пирамиды обосновано
      - Явно указано, что НЕ тестируется и почему
      - Критерии release readiness измеримы (не «всё работает», а конкретные метрики)

  release_readiness:
    name: "Оценка готовности к релизу"
    description: "Go/No-Go анализ перед релизом с чеклистом рисков и пострелизным контролем."
    required_sections:
      - "Область релиза"
      - "Чеклист готовности"
      - "Известные риски и допуски"
      - "План мониторинга после релиза"
      - "Критерии остановки/прерывания"
    required_inputs:
      - "Что входит в релиз (фичи, фиксы, миграции)"
      - "Результаты тестирования (что пройдено, что нет)"
      - "Известные проблемы и принятые допуски"
    system_prompt_addition: |
      Аналитический метод — Evidence-Based Go/No-Go с Weighted Scoring:
      - Определи критерии Go/No-Go и вес каждого (1-5): тесты, покрытие, performance baseline, security checks, readiness к безопасному прерыванию, documentation.
      - Для каждого критерия оцени статус: Pass / Pass with caveats / Fail.
      - Итоговое решение = weighted sum. Любой Fail на критерии с весом ≥4 = автоматический No-Go.
      - «Pass with caveats» MUST содержать: что именно допущено, какой риск, кто одобрил.

      Фокус: объективный Go/No-Go, а не оптимистичная оценка.
    qa_prompt: |
      Проверь, что:
      - Критерии Go/No-Go однозначны и взвешены
      - Каждый «Pass with caveats» содержит описание допущения и риска
      - Критерии остановки/прерывания однозначны (не «если что-то пойдёт не так»)
      - План мониторинга содержит конкретные метрики и пороги

  technical_debt:
    name: "Аудит техдолга"
    description: "Инвентаризация и приоритизация технического долга с оценкой стоимости и эффекта."
    required_sections:
      - "Категории техдолга"
      - "Влияние на продукт/скорость разработки"
      - "Приоритизация (impact/effort/risk)"
      - "Roadmap погашения"
      - "Критерии контроля прогресса"
    required_inputs:
      - "Какие области проекта вызывают наибольшие проблемы"
      - "Контекст: почему сейчас важно заняться техдолгом"
      - "Бюджет на погашение (% от sprint capacity или конкретные сроки)"
    system_prompt_addition: |
      Аналитический метод — Tech Debt Quadrant (Fowler) + SQALE-lite:
      - Классифицируй каждый элемент долга по квадранту Фаулера: Deliberate/Inadvertent × Reckless/Prudent.
      - Для каждого элемента оцени: Impact на скорость разработки (1-5), Effort на устранение (S/M/L/XL), Risk если не устранять (1-5).
      - Priority Score = Impact × Risk / Effort_normalized. Сортируй roadmap по Priority Score.
      - Roadmap MUST содержать quick wins (высокий impact, низкий effort) в первом sprint/этапе.

      Фокус: практичный backlog техдолга с реалистичным roadmap.
    qa_prompt: |
      Проверь, что:
      - Приоритизация прозрачна и опирается на impact/effort/risk
      - Quick wins выделены и поставлены первыми в roadmap
      - Roadmap реалистичен относительно заявленного бюджета
      - Критерии прогресса измеримы (не «стало лучше», а конкретные метрики)
