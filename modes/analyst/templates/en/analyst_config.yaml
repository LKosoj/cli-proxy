# flake8: noqa
templates:
  default:
    name: "Basic On-Demand Analysis"
    description: "Universal lightweight template: analyze the user's task and provide a structured result."
    required_sections:
      - "Request Understanding"
      - "Key Observations"
      - "Solution Options"
      - "Recommended Option"
      - "Risks and Constraints"
      - "Next Steps"
    required_inputs:
      - "Description of the task or question"
      - "Context: what decision needs to be made based on the analysis"
    system_prompt_addition: |
      Prepare a concise but practical analysis strictly according to the user's request.
      Do not attempt to turn the result into a full specification unless explicitly required.
      Focus on concrete actions and verification criteria.

      Analytical method:
      - For each solution option use the structure: "Option → Pros → Cons → Conditions of applicability".
      - The recommended option MUST contain justification for the choice: why this one and not the others.
    qa_prompt: |
      Verify that the output:
      - directly answers the user's request;
      - contains specific recommendations with justification;
      - is not overloaded with excessive detail;
      - captures key risks and next steps;
      - the recommended option is justified, not merely named.

  # Target audience for spec-oriented templates = low-middle developer:
  # the final document must be implementable without verbal explanations and must not rely on senior-only context.
  new_spec:
    name: "Specification for New Development"
    description: "Complete technical specification template for new development: requirements, architecture, acceptance."
    required_sections:
      - "Context and Overview"
      - "Goals and Measurable Success Criteria"
      - "Scope of Work (In/Out)"
      - "Assumptions and Constraints"
      - "Stakeholders, Roles, and Access Rights"
      - "User Scenarios"
      - "Functional Requirements"
      - "Non-Functional Requirements"
      - "Integrations and External Dependencies"
      - "Data and Domain Model"
      - "Architectural Decisions and Constraints"
      - "API and Contracts"
      - "Observability and Operations"
      - "Data Policies and Privacy"
      - "Implementation Plan by Phases"
      - "Testing Plan and Acceptance Criteria"
      - "Risks and Open Questions"
    required_inputs:
      - "Business goal or problem the product solves"
      - "Target audience and key users"
      - "Known constraints (budget, timeline, technology stack)"
      - "Priorities: what is critical for MVP, and what can be deferred"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "large"
    traceability_rules:
      - "Each UC-xxx MUST be covered by at least one FR-xxx"
      - "Each FR-xxx with Must priority MUST have an acceptance criterion and a test in the traceability matrix"
      - "Each API-xxx MUST be linked to the FR-xxx that requires it"
      - "Each NFR-xxx MUST have a measurable SLO and a verification method"
      - "If UC-xxx is not covered by any FR — this is a gap that MUST be resolved"
    system_prompt_addition: |
      You are an analyst. Your task is to prepare an accurate, practical document suitable for implementation.
      Avoid generic phrases and maintain the verifiability of statements.

      Analytical method — MECE decomposition:
      - Break down scope into mutually exclusive areas (Mutually Exclusive), collectively covering everything (Collectively Exhaustive).
      - For each area derive user scenarios, then from UC — functional requirements.
      - Check coverage: if a scope area has no UC — either add a UC, or explicitly move it to Out.

      Mandatory formatting rules:
      - Write so the document enables: estimating the scope of work, planning implementation, implementing without "guesswork", testing and accepting.
      - Wherever possible, use measurable values (timeouts, percentiles, RPS/concurrency, limits, retention periods, error codes).
      - Use identifiers and traceability: `UC-xxx` (scenarios), `FR-xxx` (functional), `NFR-xxx` (non-functional), `API-xxx` (contracts).

      Traceability rules (MANDATORY):
      - Each UC-xxx MUST be covered by at least one FR-xxx.
      - Each FR-xxx with Must priority MUST have an acceptance criterion and a row in the traceability matrix.
      - Each API-xxx MUST be linked to the FR-xxx that requires it.
      - At the end of the document — traceability matrix: `UC | FR | API | NFR | Test/acceptance`. All Must-FR covered.

      Section format:
      - "Scope of Work (In/Out)" format as a table: `Feature/area | In/Out | MVP/Next | Why | Dependencies/constraints`.
      - "User Scenarios": for each `UC-xxx` specify: `Actors`, `Preconditions`, `Steps`, `Expected Result`, `Errors/Exceptions` (at least 1 negative scenario for critical flows).
      - "Functional Requirements": format as a list of requirements `FR-xxx` grouped by priority `Must/Should/Could`. For each `FR-xxx` specify:
        `Description` (1-2 sentences), `Acceptance Criterion` (pass/fail), `Verification/Test` (how to verify), `Errors/Validation` (which errors and under what conditions).
      - "Non-Functional Requirements": use `NFR-xxx` and a SLI/SLO table:
        `Metric (SLI) | Goal (SLO) | Measurement Window | 95p/99p (if applicable) | Where We Measure | Notes`.
        Specify what is considered "normal" and "peak" load (in system terms), and what degradations are acceptable/unacceptable.
      - "API and Contracts": describe key interfaces in contract format `API-xxx`. For each contract specify at minimum:
        `Purpose`, `Authentication/Authorization`, `Input Data` (schema + example), `Output Data` (schema + example),
        `Errors` (error codes/types and conditions), `Idempotency/Concurrency` (if applicable), `Limits/Quotas` (if applicable).
        If the system has events/messages (asynchronous interfaces), describe analogous contracts for them: `type`, `payload`, `ack/errors`, `order/retries` (if relevant).
    qa_prompt: |
      Traceability check (BLOCKING):
      - Is each UC-xxx covered by at least one FR-xxx? If not — REWORK.
      - Does each Must FR-xxx have an acceptance criterion (pass/fail)? If not — REWORK.
      - Is each API-xxx linked to a FR-xxx? If not — REWORK.
      - Is the traceability matrix present and all Must-FR covered? If not — REWORK.

      Completeness check:
      - Each section is present and non-empty
      - "Scope of Work (In/Out)" contains explicit In and Out lists (without ambiguity)
      - "Stakeholders, Roles, and Access Rights" describes roles, permissions, and key flows
      - "User Scenarios" cover key paths (happy path and 1-2 negative scenarios for critical functions)
      - "Functional Requirements" are prioritized (Must/Should/Could) and contain verification criteria
      - "Non-Functional Requirements" include measurable SLO/SLI
      - "Data and Domain Model" contains entities, fields, and relationships
      - "API and Contracts" contain payload examples and error codes
      - "Observability and Operations" contains metrics/logs/traces, alerts
      - "Testing Plan and Acceptance Criteria" contains clear pass/fail criteria for Must requirements
      If something is vague, rewrite it concretely.

  audit:
    name: "Audit Report"
    description: "Critical audit of an existing document/codebase with risks and recommendations."
    required_sections:
      - "Overall Assessment"
      - "Observations"
      - "Risks"
      - "Recommendations"
      - "Next Steps"
    required_inputs:
      - "What exactly is being audited (file, module, project, document)"
      - "Audit focus (security, architecture, code quality, requirements compliance)"
    system_prompt_addition: |
      You are an auditor. Be critical, rely on evidence, and highlight the most important issues.

      Analytical method — Evidence-Based Audit:
      - For each observation use the structure: "Fact (what was found, where) → Impact (what it means) → Recommendation (what to do)".
      - Classify each observation by severity: Critical / Major / Minor / Info.
      - Critical and Major MUST contain specific references to files/functions/lines.
      - Separate confirmed facts from hypotheses — mark hypotheses as [Requires Verification].
    qa_prompt: |
      Verify that the audit report:
      - Each observation contains: fact + source + severity + recommendation
      - Critical/Major observations reference specific files/functions
      - Facts are separated from assumptions (hypotheses are marked)
      - Recommendations are prioritized and actionable (what, where, why)
      Rewrite vague statements as concrete observations.

  change_spec:
    name: "Specification for Change"
    description: "Template for changes to an existing product/project with repo-grounded scope, impact, and verification."
    required_sections:
      - "Current System Context"
      - "Confirmed Facts and Sources"
      - "Change Goals and Success Criteria"
      - "Confirmed Changes by Component"
      - "Impact on Code, Data, API, and UX"
      - "Implementation Handoff by Components and Files"
      - "Compatibility and Deployment Constraints"
      - "Risks and Open Verifications"
      - "Testing and Acceptance Plan"
    required_inputs:
      - "What exactly needs to be changed and why (business reason)"
      - "Which components/modules are affected or presumably affected"
      - "Backward compatibility requirements"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: false
    target_size_hint: "medium"
    traceability_rules:
      - "Each change MUST be linked to a component and contain: what we are changing, how we test it, what compatibility constraints we take into account"
      - "Impact analysis MUST cover all components from the list of changes"
      - "Each affected API MUST have a description of contract changes (before/after)"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    system_prompt_addition: |
      Analytical method — Impact-Driven Change Analysis:
      - For each change apply the structure: "Component/subsystem → Confirmed current behavior → Target behavior → What exactly we change → How we verify".
      - Check cascading effects: if A changes, what depends on A? What depends on A's dependencies?
      - Document blast radius only for confirmed affected zones. Do not add surfaces, integrations, migrations, or deployment steps unless confirmed by project code or direct user request.
      - Do not list all project surfaces. Describe only components, files, and user scenarios directly needed for this change.
      - If the change is local, do not inflate the document into a general enterprise-change-plan.

      Focus: minimally invasive changes, backward compatibility, and verifiable acceptance criteria.
      Use the real repository as source of truth and make the document suitable for a low-middle developer without verbal explanations.
    qa_prompt: |
      Traceability check (BLOCKING):
      - For each change: is it specified where we change, confirmed current/target behavior, how we test? If not — REWORK.
      - Does the impact analysis cover all components from the list of changes? If not — REWORK.
      Completeness check:
      - Document is repo-grounded and does not contradict the code
      - Sufficient for a low-middle developer without verbal explanations
      - Cascading effects of changes have been analyzed
      - No invented surfaces, integrations, route/controller/table/test-file paths without repo evidence
      - No sections about untouched project surfaces unless confirmed by request or code
      - Migrations and deployment are mentioned only if genuinely required by confirmed changes

  ui_change_spec:
    name: "Specification for Local UI/UX Change"
    description: "Narrow repo-grounded template for local interface, component, or user scenario changes."
    required_sections:
      - "Context and Confirmed Facts"
      - "Confirmed Facts and Sources"
      - "Target Behavior and UX Criteria"
      - "Changes by Components and States"
      - "Affected Files, Dependencies, and Constraints"
      - "Implementation Handoff by Components and Files"
      - "Implementation, Verification, and Acceptance Plan"
      - "Open Questions and Risks"
    required_inputs:
      - "What exactly needs to be changed in UI/UX and why"
      - "Which component, screen, or user scenario is affected"
      - "What must not be broken in the current behavior"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Each change MUST be linked to a specific component/state and a confirmed file or artifact"
      - "Each acceptance criterion MUST verify a specific visible interface behavior"
      - "If backward compatibility of a UX scenario is affected, this MUST be explicitly described"
    system_prompt_addition: |
      You are preparing a narrow working specification for a local UI/UX change to an existing project.

      Analytical method:
      - For each change use the structure: "Component/state → Confirmed current behavior → Target behavior → What we change in markup/logic/styles → How we verify".
      - Focus on local scope: component, screen, form, dropdown, header, menu, CTA, states, responsive behavior.
      - Do not inflate the document into a general change-plan covering data, API, migrations, rollout, or infrastructure unless confirmed by project code.
      - If backend/API/data are genuinely affected, describe only the confirmed impact zone and explicitly separate it from the UI part.
      - List affected surfaces only if they are directly confirmed by the repository and are actually being changed.
    qa_prompt: |
      Completeness check (BLOCKING):
      - For each change: is it specified where we change, confirmed current behavior, target behavior, acceptance criterion.
      - All recommendations are repo-grounded and linked to specific files/components/states.
      - No invented route/controller/table/API/test-file paths without repo evidence.
      - Document is not bloated with extra sections about migrations, rollout, infrastructure, or external surfaces unless confirmed.
      - Open questions are listed separately and not masked as ready solutions.

  bugfix_spec:
    name: "Specification for Bug Fix"
    description: "Narrow repo-grounded template for fixing a specific bug or regression in an existing system."
    required_sections:
      - "Bug Context and Confirmed Symptoms"
      - "Confirmed Facts and Sources"
      - "Confirmed Current Behavior and Failure Zone"
      - "Target Behavior and Fix Criteria"
      - "Fix Plan and Affected Files"
      - "Implementation Handoff by Components and Files"
      - "Regression Risks and Verifications"
      - "Open Questions"
    required_inputs:
      - "What bug or regression is observed"
      - "What scenario should work after the fix"
      - "What must not be broken near this bug"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Each fix MUST be linked to a confirmed symptom and a specific code zone"
      - "Each acceptance criterion MUST prove the bug is resolved and key regression is absent"
    system_prompt_addition: |
      Focus on one bug or a closely related group of symptoms.
      Use the structure: "Symptom → Confirmed failure zone → What we fix → How we verify the fix".
      Do not inflate the document into a general refactor/change-plan.
      If the root cause is not confirmed, separate it from symptom-level facts.
    qa_prompt: |
      Completeness check:
      - Symptoms and the confirmed failure zone are described separately.
      - The fix plan is linked to specific files/components.
      - There are fix verification criteria and a minimal anti-regression set.
      - No invented root causes, API, tables, or routes without repo evidence.

  integration_change_spec:
    name: "Specification for Integration Change"
    description: "Narrow repo-grounded template for changes to external integrations, API contracts, webhooks, or providers."
    required_sections:
      - "Integration Context and Confirmed Entry Points"
      - "Confirmed Facts and Sources"
      - "Current and Target Integration Behavior"
      - "Contract, Payload, and Error Handling Changes"
      - "Affected Components and Compatibility Constraints"
      - "Implementation Handoff by Components and Files"
      - "Integration Verification Plan"
      - "Open Risks and Dependencies"
    required_inputs:
      - "Which integration or external contract is changing"
      - "What exactly should change in data exchange or behavior"
      - "Which compatibility constraints are mandatory"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Each change MUST be linked to a specific integration point or contract"
      - "For each contract MUST be described the current and target behavior, including errors"
    system_prompt_addition: |
      Focus on confirmed integration points: API client, webhook handler, provider adapter, payload schema, retry/error handling.
      Do not expand the document into a general product change-plan if only the integration layer is changing.
      If the external part is not confirmed by project code, explicitly mark it as [Requires Verification].
    qa_prompt: |
      Completeness check:
      - Changes are linked to specific integration points.
      - Input/output payloads, errors, and compatibility are described.
      - No invented endpoint/provider/table without repo evidence.
      - Verification plan covers happy path and fault tolerance.

  narrow_backend_change_spec:
    name: "Specification for Narrow Backend Change"
    description: "Narrow repo-grounded template for local server-side changes without broad product scope."
    required_sections:
      - "Backend Zone Context and Confirmed Facts"
      - "Confirmed Facts and Sources"
      - "Current and Target Logic Behavior"
      - "Changes to Services, Handlers, Data, and Contracts"
      - "Implementation Handoff by Components and Files"
      - "Compatibility, Constraints, and Side Effects"
      - "Implementation and Verification Plan"
      - "Open Questions and Risks"
    required_inputs:
      - "What server-side logic needs to be changed"
      - "Which component/service/handler is affected"
      - "Which scenarios must not be broken"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "medium"
    repo_grounded_required: true
    final_repo_review_required: true
    traceability_rules:
      - "Each change MUST be linked to a confirmed backend component and current behavior"
      - "The verification plan MUST cover key side effects and compatibility"
    system_prompt_addition: |
      Focus on local backend logic: service, handler, controller, domain model, validation, internal contract.
      Do not inflate the document into a refactor-wide or project-wide plan if the change is local.
      If data/API are affected, describe only the confirmed impact zone.
    qa_prompt: |
      Completeness check:
      - Current and target backend logic behavior is described and linked to the code.
      - Side effects and compatibility are listed explicitly.
      - No invented tables, endpoints, events, or classes without repo evidence.
      - Verification plan covers the main scenario and regression zones.

  project_analysis:
    name: "Project Analysis"
    description: "Structural analysis of an existing project: architecture, issues, recommendations, next steps."
    required_sections:
      - "Executive Summary"
      - "Architectural Overview"
      - "Technical Risks and Bottlenecks"
      - "Code Quality and Test Coverage"
      - "Priority Recommendations"
      - "Action Plan for 30/60/90 Days"
    required_inputs:
      - "Analysis goal (decision about refactoring, pre-release audit, onboarding, etc.)"
      - "Which project aspects are most important (architecture, quality, performance, security)"
    system_prompt_addition: |
      Analytical method — ATAM-lite (Architecture Tradeoff Analysis):
      - Identify key architectural drivers (system qualities that matter to stakeholders).
      - For each architectural decision determine: which qualities it supports, which it limits (tradeoff).
      - Risks = points where architectural decisions do NOT support declared qualities.
      - Recommendations MUST be linked to specific risks, not be general wishes.

      Focus: specific observations and evidence from the repository. Avoid generic phrases.
    qa_prompt: |
      Verify that:
      - Each risk is confirmed by an observation from code/configs (with file/function reference)
      - Recommendations are prioritized by impact/effort
      - The 30/60/90 plan is realistic and linked to specific risks
      - No "general recommendations" without connection to an observation

  bug_investigation:
    name: "Bug Investigation Specification"
    description: "Template for defect analysis: reproduction, hypotheses, RCA, fix plan, and validation."
    required_sections:
      - "Symptoms and Context"
      - "Reproduction Steps"
      - "Root Cause Hypotheses"
      - "Root Cause"
      - "Fix Plan"
      - "Verification and Regressions"
    required_inputs:
      - "Description of observed behavior (what is happening)"
      - "Description of expected behavior (what should happen)"
      - "Reproduction conditions (environment, data, sequence of actions)"
    system_prompt_addition: |
      Analytical method — 5 Whys + Fault Tree:
      - For each symptom ask "why?" at least 5 times until you reach the root cause.
      - Build a cause tree (Fault Tree): root = observed symptom, leaves = possible root causes.
      - For each hypothesis specify: how to confirm (what to check in code/logs/data) and how to refute.
      - Root cause MUST be confirmed by specific evidence, not just "the most likely hypothesis".

      Focus: cause-and-effect relationships, not enumeration of symptoms.
    qa_prompt: |
      Verify that:
      - Root cause is confirmed by specific evidence (file, line, log, state)
      - The chain "symptom → ... → root cause" is logical and has no missing links
      - The fix plan eliminates the root cause, not the symptoms
      - Regression scenarios cover the changed behavior

  incident_rca:
    name: "Incident RCA"
    description: "Post-incident review: timeline, root cause, corrective/preventive actions."
    required_sections:
      - "Incident Description"
      - "Timeline"
      - "Impact and Affected Zones"
      - "Root Cause"
      - "Corrective actions"
      - "Preventive actions"
      - "Control Metrics After Fixes"
    required_inputs:
      - "When did the incident occur and when was it detected"
      - "Description of impact on users/system"
      - "Available logs, metrics, alerts for the incident"
    system_prompt_addition: |
      Analytical method — Ishikawa (Fishbone) + Swiss Cheese Model:
      - Build an Ishikawa diagram: classify causes by categories (People, Process, Technology, Environment).
      - Apply the Swiss Cheese Model: determine which protective layers (monitoring, tests, review, alerts) were breached and why.
      - Timeline MUST contain: event time, who detected it, what action was taken, result of the action.
      - Preventive actions MUST close specific "holes" in protective layers, not be general recommendations.

      Focus: verifiable facts, without blame-seeking.
    qa_prompt: |
      Verify that:
      - Timeline is complete: from the first symptom to full recovery
      - Root cause is confirmed by facts, not assigned
      - Each preventive action closes a specific "hole" in the protective layer
      - Preventive actions have an owner and deadline (or are marked [Needs Assignment])

  impact_analysis:
    name: "Change Impact Analysis"
    description: "Assessment of the impact of a planned change on the system, data, API, operations, and tests."
    required_sections:
      - "Change Description"
      - "Affected Subsystems"
      - "Impact on API/Contracts"
      - "Impact on Data and Migrations"
      - "Impact on Infrastructure/Observability"
      - "Risks and Mitigation Measures"
      - "Verification Plan"
    required_inputs:
      - "Description of the planned change"
      - "Which components/modules are directly affected"
      - "Are there backward compatibility or downtime requirements"
    system_prompt_addition: |
      Analytical method — FMEA-lite (Failure Mode and Effects Analysis):
      - For each affected subsystem identify possible failure modes (how it could break).
      - For each failure mode assess: Severity (1-5), Likelihood (1-5), Detectability (1-5).
      - Risk Priority = Severity × Likelihood × Detectability. Focus on top-5 by Risk Priority.
      - For each risk in the top-5 MUST be a specific mitigation measure.

      Focus: traceable coverage of all impact zones. Check cascading dependencies.
    qa_prompt: |
      Verify that:
      - No "blind spots" (data, permissions, monitoring, actions on failure)
      - Cascading dependencies are analyzed (not just direct ones)
      - For each risk in the top-5 there is a mitigation measure
      - Verification plan covers all affected subsystems

  refactor_spec:
    name: "Refactoring Specification"
    description: "Refactoring plan without behavior change: boundaries, phases, regression control."
    required_sections:
      - "Current Codebase State"
      - "Confirmed Facts and Sources"
      - "Target State"
      - "Constraints and Non-Goals"
      - "Affected Surfaces"
      - "Changes by Layers/Components"
      - "Persistence/State/Config Changes"
      - "Migration and Compatibility"
      - "Startup/Restore/Reconcile Logic"
      - "Legacy Removal and What Exactly Is Deleted"
      - "Implementation Plan by Phases"
      - "Implementation Handoff by Components and Files"
      - "Behavioral Equivalence Control"
      - "Testing Plan and Acceptance Criteria"
      - "Risks and Open Questions"
    required_inputs:
      - "What exactly is being refactored and why (tech debt, performance, extensibility)"
      - "Explicit boundaries: what is NOT in the refactoring scope"
      - "Behavioral equivalence criteria (how to prove that behavior has not changed)"
    compose_mode: "template_first"
    output_kind: "spec"
    artifact_preferred: true
    target_size_hint: "large"
    traceability_rules:
      - "Each change per layer/component MUST have a way to verify behavioral equivalence"
      - "Each phase of the plan MUST contain: affected components, risks, stop criterion"
      - "Each removed entity MUST be verified for absence of dependencies"
    repo_grounded_required: true
    repo_audit_required: true
    final_repo_review_required: true
    system_prompt_addition: |
      You are preparing a working refactoring specification for an existing project.

      Analytical method — Strangler Fig Pattern + Characterization Tests:
      - For each component determine: current behavior (characterization) → target structure → transition path.
      - Refactoring MUST be incremental: each phase leaves the system in a working state.
      - For each phase define characterization tests: tests that capture current behavior and MUST pass after changes.

      Mandatory rules:
      - source of truth = real project files, not just the codebase map;
      - the document must be sufficient for a low-middle developer without verbal explanations;
      - refactoring must not expand scope and must not silently change behavior;
      - for each phase explicitly state affected components, risks, verification method, and stop criterion;
      - separately capture only confirmed affected surfaces and artifacts that genuinely need to be rechecked after refactoring;
      - if a new config key, fallback layer, compatibility wrapper, entity, or API is proposed, it must be explicitly justified by code or user request.
    qa_prompt: |
      Traceability check (BLOCKING):
      - Does each phase have: affected components, risks, verification method, stop criterion? If not — REWORK.
      - Is each removed entity verified for absence of dependencies? If not — REWORK.
      Completeness check:
      - Remains a template-first specification, not a general discussion
      - Contains explicit scope boundaries and non-goals
      - Lists only confirmed affected surfaces/artifacts, not a boilerplate list
      - Sets objective criteria for "behavior has not changed"
      - Suitable for a low-middle developer without verbal explanations
      - Contains stop/abort criteria

  migration_plan:
    name: "Migration Plan"
    description: "Template for technology/schema/contract migration with phasing and safe abort."
    required_sections:
      - "Migration Goals"
      - "Current and Target State"
      - "Transition Strategy"
      - "Backward Compatibility Plan"
      - "Safe Abort Plan"
      - "Completion Criteria"
    required_inputs:
      - "What is being migrated (technology, data schema, API, infrastructure)"
      - "Reason for migration and expected result"
      - "Acceptable downtime and migration window"
      - "Backward compatibility requirements"
    system_prompt_addition: |
      Analytical method — Blue-Green / Canary Migration:
      - Define the transition strategy: Big Bang, Blue-Green, Canary, Strangler Fig — and justify the choice.
      - For each phase define: point of no return, stop/abort criteria, health metrics.
      - Plan for failure: for each phase describe what to do if it fails.
      - The safe abort scenario MUST be verifiable in a test environment before starting production migration.

      Focus: minimize downtime and risk of data loss.
    qa_prompt: |
      Verify that:
      - Transition strategy is justified (why this particular approach)
      - Each phase has a point of no return and stop/abort criteria
      - The safe abort scenario is realistic and verifiable in a test environment
      - No phases without a defined failure plan

  integration_contract:
    name: "Integration Contract"
    description: "Integration specification with an external/internal service: contracts, errors, reliability."
    required_sections:
      - "Integration Purpose"
      - "Request/Response or Event Contracts"
      - "Errors, Retries, and Timeouts"
      - "Idempotency and Consistency"
      - "Observability and SLA/SLO"
      - "Integration Testing Plan"
    required_inputs:
      - "What we are integrating with (service, API, queue)"
      - "Integration direction (we call / we are called / bidirectional)"
      - "Reliability requirements and acceptable latency"
    system_prompt_addition: |
      Analytical method — Contract-First Design:
      - Define the contract BEFORE implementation: schema → examples → errors → edge cases.
      - For each endpoint/event define: happy path, timeout, partial failure, retry semantics.
      - Use Consumer-Driven Contract approach: start with what the consumer needs, not what is convenient for the provider.
      - Explicitly define Circuit Breaker parameters: threshold, timeout, half-open policy.

      Focus: explicit contracts and predictable behavior on failures.
    qa_prompt: |
      Verify that:
      - Contract includes negative scenarios (timeout, partial failure, 4xx/5xx)
      - Retry/backoff policy is explicitly defined (max retries, backoff strategy, jitter)
      - Idempotency is described for mutating operations
      - Circuit Breaker parameters are defined

  security_review:
    name: "Security Analysis"
    description: "Threat, vulnerability, and protection assessment with risk-based prioritization."
    required_sections:
      - "Attack Surface"
      - "Threat Model"
      - "Vulnerabilities and Risk Level"
      - "Remediation Plan"
      - "Hardening and Control Checks"
    required_inputs:
      - "What is being analyzed (system, component, API, infrastructure)"
      - "Attacker model (external, insider, automated attack)"
      - "Data criticality (PII, financial, confidential)"
    system_prompt_addition: |
      Analytical method — STRIDE + DREAD scoring:
      - For each system component apply STRIDE: Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege.
      - For each identified threat assess using DREAD: Damage (1-10), Reproducibility (1-10), Exploitability (1-10), Affected Users (1-10), Discoverability (1-10).
      - Risk Score = average DREAD. Prioritize remediation by Risk Score.
      - For each vulnerability with Risk Score > 5 MUST be a specific remediation plan.

      Focus: risk-oriented approach and practical remediation measures.
    qa_prompt: |
      Verify that:
      - STRIDE coverage is complete for key components
      - Each vulnerability has a DREAD score or equivalent prioritization
      - Vulnerabilities with high risk have a specific remediation plan
      - Remediation plan contains: what, where, who, closure criterion

  performance_analysis:
    name: "Performance Analysis"
    description: "Bottleneck diagnostics and optimization plan with measurable effect."
    required_sections:
      - "Current State and Metrics (Baseline)"
      - "Bottleneck Hypotheses"
      - "Measurement/Profiling Plan"
      - "Proposed Optimizations"
      - "Expected Effect"
      - "Results Validation Plan"
    required_inputs:
      - "Which operations/scenarios are slow (specific endpoints, pages, processes)"
      - "Current metrics (latency, throughput, resource usage) — if available"
      - "Target metrics (what latency/throughput is acceptable)"
    system_prompt_addition: |
      Analytical method — USE Method (Utilization, Saturation, Errors) + RED Method (Rate, Errors, Duration):
      - For each resource (CPU, memory, disk, network, DB connections, queues) determine: Utilization, Saturation, Errors.
      - For each service determine: Rate (rps), Errors (error rate), Duration (latency p50/p95/p99).
      - Hypotheses MUST be falsifiable: for each one specify what experiment/metric to check.
      - For each optimization specify: expected improvement (quantitatively), implementation cost, risks.

      Focus: metrics, baseline, and effect forecast for each optimization.
    qa_prompt: |
      Verify that:
      - Baseline is recorded (current metrics)
      - Each hypothesis is falsifiable (verification method is specified)
      - Expected optimization effect is quantitative, not "it will be faster"
      - Proposed measures are proportionate to the expected gain (no micro-optimizations when architectural bottlenecks exist)

  test_strategy:
    name: "Testing Strategy"
    description: "Testing plan for functionality/system: levels, priorities, readiness criteria."
    required_sections:
      - "Testing Scope"
      - "Risk-Based Matrix"
      - "Unit/Integration/E2E Strategy"
      - "Test Data and Environments"
      - "Release Readiness Criteria"
    required_inputs:
      - "What is being tested (new functionality, regression, migration)"
      - "Testing budget (time, resources, environments)"
      - "Critical user scenarios"
    system_prompt_addition: |
      Analytical method — Risk-Based Testing + Test Pyramid:
      - Build a risk matrix: Functionality × Defect Probability × Defect Impact.
      - Distribute the testing budget across the Test Pyramid: Unit (70%) → Integration (20%) → E2E (10%) — adapt to context.
      - For top-risk zones determine: which tests MUST exist, at which pyramid level.
      - Define: what is NOT tested and why (explicit decision, not omission).

      Focus: maximize risk reduction within a limited testing budget.
    qa_prompt: |
      Verify that:
      - Risk matrix covers critical user and operational scenarios
      - Distribution across pyramid levels is justified
      - What is NOT tested and why is explicitly stated
      - Release readiness criteria are measurable (not "everything works", but specific metrics)

  release_readiness:
    name: "Release Readiness Assessment"
    description: "Go/No-Go analysis before release with risk checklist and post-release control."
    required_sections:
      - "Release Scope"
      - "Readiness Checklist"
      - "Known Risks and Accepted Caveats"
      - "Post-Release Monitoring Plan"
      - "Stop/Abort Criteria"
    required_inputs:
      - "What is in the release (features, fixes, migrations)"
      - "Test results (what passed, what did not)"
      - "Known issues and accepted caveats"
    system_prompt_addition: |
      Analytical method — Evidence-Based Go/No-Go with Weighted Scoring:
      - Define Go/No-Go criteria and weight each (1-5): tests, coverage, performance baseline, security checks, safe abort readiness, documentation.
      - For each criterion assess the status: Pass / Pass with caveats / Fail.
      - Final decision = weighted sum. Any Fail on a criterion with weight ≥4 = automatic No-Go.
      - "Pass with caveats" MUST contain: what exactly is accepted, what risk, who approved.

      Focus: objective Go/No-Go, not an optimistic assessment.
    qa_prompt: |
      Verify that:
      - Go/No-Go criteria are unambiguous and weighted
      - Each "Pass with caveats" contains description of the accepted caveat and risk
      - Stop/abort criteria are unambiguous (not "if something goes wrong")
      - Monitoring plan contains specific metrics and thresholds

  technical_debt:
    name: "Tech Debt Audit"
    description: "Inventory and prioritization of technical debt with cost and impact assessment."
    required_sections:
      - "Tech Debt Categories"
      - "Impact on Product/Development Velocity"
      - "Prioritization (impact/effort/risk)"
      - "Repayment Roadmap"
      - "Progress Control Criteria"
    required_inputs:
      - "Which project areas cause the most problems"
      - "Context: why addressing tech debt is important now"
      - "Repayment budget (% of sprint capacity or specific deadlines)"
    system_prompt_addition: |
      Analytical method — Tech Debt Quadrant (Fowler) + SQALE-lite:
      - Classify each debt item by Fowler's quadrant: Deliberate/Inadvertent × Reckless/Prudent.
      - For each item assess: Impact on development velocity (1-5), Effort to resolve (S/M/L/XL), Risk if not resolved (1-5).
      - Priority Score = Impact × Risk / Effort_normalized. Sort roadmap by Priority Score.
      - Roadmap MUST contain quick wins (high impact, low effort) in the first sprint/phase.

      Focus: practical tech debt backlog with a realistic roadmap.
    qa_prompt: |
      Verify that:
      - Prioritization is transparent and based on impact/effort/risk
      - Quick wins are identified and placed first in the roadmap
      - Roadmap is realistic relative to the declared budget
      - Progress criteria are measurable (not "it got better", but specific metrics)
