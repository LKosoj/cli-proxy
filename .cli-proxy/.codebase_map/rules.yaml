organizational_rules:
  - id: rule-sync-playwright-cli-orchestrator
    kind: sync_areas
    source_class: observed
    confidence: 0.62
    status: proposed
    needs_review: true
    when:
      any_path_matches:
        - ".playwright-cli"
        - "_orchestrator/**"
    then:
      enforce_sync_with:
        - ".playwright-cli"
        - "_orchestrator"
    evidence:
      - "observed:git_cochange:2/120"
  - id: rule-sync-playwright-cli-agent
